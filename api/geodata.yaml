paths:
  /api/v1/geodata:
    get:
      operationId: getGeoData
      tags: [ Geodata ]
      summary: Read the geosite and geoip assets the engine loaded
      description: |
        Requires resources.geodata.available; otherwise returns 404
        capability_not_supported. One entry per asset kind in
        resources.geodata.assets, describing the file the running datapath was
        built from: its digest, size and modification time, and the download source
        POST /geodata/update tries first, in the display form described in
        Geodata. When
        resources.geodata.configurable_sources is true, the response also reports
        where each loaded file was downloaded from and through which route, whether
        its checksum was verified, the update schedule and outcome, and
        required_codes. Reading never touches the network.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Loaded assets
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/GeoData
              examples:
                loaded:
                  value:
                    observed_at: 2026-08-15T10:00:00Z
                    assets:
                      - kind: geosite
                        sha256: 3f5a9c1e7b2d4c6a8e0f1b3d5a7c9e1f3b5d7a9c1e3f5a7b9d1c3e5f7a9b1d3c
                        size_bytes: "4404019"
                        modified_at: 2026-08-14T03:00:00Z
                        source_redacted: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat
                        fetched_url_redacted: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
                        verified: true
                        download_route: { route: group, group_id: group-proxy }
                      - kind: geoip
                        sha256: 9b1d3c5e7f0a2c4e6b8d0f2a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2b4d6f8a0c2e
                        size_bytes: "17406771"
                        modified_at: 2026-08-14T03:00:00Z
                        source_redacted: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat
                        fetched_url_redacted: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat
                        verified: true
                        download_route: { route: group, group_id: group-proxy }
                    last_checked_at: 2026-08-15T03:12:40Z
                    last_updated_at: 2026-08-14T03:00:00Z
                    next_check_at: 2026-08-16T03:41:07Z
                    last_error: null
                    required_codes:
                      geosite: [ category-ads-all, cn, geolocation-!cn, private ]
                      geoip: [ cn, private ]
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
                packaged:
                  summary: Files installed by a package, before any update
                  value:
                    observed_at: 2026-08-15T10:00:00Z
                    assets:
                      - kind: geosite
                        sha256: 3f5a9c1e7b2d4c6a8e0f1b3d5a7c9e1f3b5d7a9c1e3f5a7b9d1c3e5f7a9b1d3c
                        size_bytes: "4404019"
                        modified_at: 2026-08-01T00:00:00Z
                        source_redacted: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat
                        fetched_url_redacted: null
                        verified: false
                        download_route: null
                      - kind: geoip
                        sha256: 9b1d3c5e7f0a2c4e6b8d0f2a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2b4d6f8a0c2e
                        size_bytes: "17406771"
                        modified_at: 2026-08-01T00:00:00Z
                        source_redacted: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat
                        fetched_url_redacted: null
                        verified: false
                        download_route: null
                    last_checked_at: 2026-08-15T09:58:02Z
                    last_updated_at: null
                    next_check_at: null
                    last_error:
                      code: download_failed
                      message: No configured URL for geosite returned a usable file.
                      details: null
                    required_codes:
                      geosite: [ cn, geolocation-!cn ]
                      geoip: [ cn ]
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
  /api/v1/geodata/update:
    post:
      operationId: updateGeoData
      tags: [ Geodata ]
      summary: Queue a download of the geosite and geoip assets
      description: |
        Requires resources.geodata.can_update; otherwise returns 404
        capability_not_supported. Takes no request body and never changes the
        configured sources. The engine downloads every asset from its source into a
        temporary file, verifies it parses, replaces the loaded file and reloads the
        datapath once, emitting generation.changed; an asset that fails to download
        or parse leaves the loaded file in place and fails the operation. With
        several URLs for an asset, the engine tries them in order and moves to the
        next only when one fails: a connection error, a status other than 200
        (redirects are not followed), the per-URL deadline, or a failed checksum
        by the resources.geodata.checksum method. With sha256sum, a 404 for the
        checksum URL means none is published and the file is accepted unverified;
        a mismatch, another status or a connection error fails the URL. A
        fetched checksum goes through the same route as its file. With
        GeoDataSettings.verify_checksum false, or a null checksum method, no
        checksum is checked and the file is accepted unverified. Every request leaves
        through the route in GeoDataSettings.download; a URL the route cannot reach,
        because a group has no usable member or the routing rules block it, fails like
        a connection error and the next URL is tried. The engine never falls back to
        direct. The update fails when the new file lacks a category the active
        configuration uses.
        Identical bytes leave the loaded file and generation unchanged. An automatic
        update runs as the same operation kind and holds the same exclusivity. Follow the
        shared operation ownership, retention and idempotency rules. Replaying an
        accepted Idempotency-Key returns its original operation; a distinct update
        while one is queued or running returns 409 state_conflict. A full bounded
        queue returns 503 temporarily_unavailable with Retry-After. A successful
        geodata_update operation returns the new GeoData in result; failure uses
        SafeError.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/IdempotencyKey
      responses:
        "202":
          description: Geodata update accepted
          headers:
            Location:
              description: Operation status URL; equal to body href.
              required: true
              schema:
                type: string
                pattern: ^/api/v1/operations/[^/]+$
            Retry-After:
              description: Positive polling floor in seconds.
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/GeoDataUpdateAccepted
              examples:
                queued:
                  value:
                    operation_id: op-geodata-01
                    kind: geodata_update
                    status: queued
                    href: /api/v1/operations/op-geodata-01
                  x-headers:
                    Content-Type: application/json
                    Location: /api/v1/operations/op-geodata-01
                    Retry-After: 2
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "409":
          description: An update is queued or running, or an idempotency key conflicts
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                in_flight:
                  value:
                    error:
                      code: state_conflict
                      message: A geodata update is already queued or running.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
        "429":
          $ref: ./openapi.yaml#/components/responses/RateLimited
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
schemas:
  GeoAssetKind:
    type: string
    enum: [ geosite, geoip ]
  GeoAsset:
    type: object
    required: [ kind, sha256, size_bytes, modified_at, source_redacted ]
    properties:
      kind:
        $ref: ./openapi.yaml#/components/schemas/GeoAssetKind
      sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
        description: Digest of the loaded file.
      size_bytes:
        $ref: ./openapi.yaml#/components/schemas/UInt64
      modified_at:
        $ref: ./openapi.yaml#/components/schemas/NullableTimestamp
        description: Modification time of the loaded file, or null when the filesystem does not report one.
      source_redacted:
        type: [ string, "null" ]
        minLength: 1
        description: Display-only download source, in the display form described in Geodata; query removed and credential-shaped path segments replaced with [redacted]. With several configured URLs, the first. Null when no source is configured or the URL does not parse, including a URL with userinfo or a fragment.
      fetched_url_redacted:
        type: [ string, "null" ]
        minLength: 1
        description: Display-only URL the loaded file was downloaded from, in the same display form as source_redacted and null under the same conditions. Null when the engine did not download the loaded file, for example a file installed by a package. Reported when resources.geodata.configurable_sources is true.
      verified:
        type: boolean
        description: The loaded file was downloaded and matched the checksum found by the resources.geodata.checksum method for its download URL. False when no checksum was found, the method is null, verification was off, or the engine did not download the file. Reported when resources.geodata.configurable_sources is true.
      download_route:
        description: The route the loaded file was downloaded through. route is the GeoDataSettings.download route in force for that download. group_id is the group the request went through, the one the routing rules chose for route routing, and null for direct, for routing rules that chose direct or a single node, and for a group that no longer exists. Null when the engine did not download the loaded file. Reported when resources.geodata.configurable_sources is true.
        oneOf:
          - type: "null"
          - $ref: ./openapi.yaml#/components/schemas/GeoDataDownload
    dependentRequired:
      fetched_url_redacted: [ verified, download_route ]
      verified: [ fetched_url_redacted ]
      download_route: [ fetched_url_redacted ]
  GeoData:
    type: object
    required: [ observed_at, assets ]
    properties:
      observed_at:
        $ref: ./openapi.yaml#/components/schemas/Timestamp
      assets:
        type: array
        items:
          $ref: ./openapi.yaml#/components/schemas/GeoAsset
      last_checked_at:
        $ref: ./openapi.yaml#/components/schemas/NullableTimestamp
        description: When the last update attempt, manual or automatic, finished, whatever its outcome. Null before the first.
      last_updated_at:
        $ref: ./openapi.yaml#/components/schemas/NullableTimestamp
        description: When an update last replaced a loaded file. Null before the first.
      next_check_at:
        $ref: ./openapi.yaml#/components/schemas/NullableTimestamp
        description: When the next automatic update is due, including its random delay and any failure backoff. Null while automatic updates are off.
      last_error:
        description: Why the last attempt failed after every URL was tried, with an engine-defined code. Null after a successful or unchanged attempt, and before the first.
        oneOf:
          - type: "null"
          - $ref: ./openapi.yaml#/components/schemas/SafeError
      required_codes:
        type: object
        description: For each kind in resources.geodata.assets, the lowercase category names the active configuration references, sorted and without attribute suffixes. A replacement file must contain all of them.
        propertyNames:
          $ref: ./openapi.yaml#/components/schemas/GeoAssetKind
        additionalProperties:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
    description: The update status fields and required_codes are reported together, when resources.geodata.configurable_sources is true.
    dependentRequired:
      last_checked_at: [ last_updated_at, next_check_at, last_error, required_codes ]
      last_updated_at: [ last_checked_at ]
      next_check_at: [ last_checked_at ]
      last_error: [ last_checked_at ]
      required_codes: [ last_checked_at ]
  GeoDataSettingsSource:
    type: string
    enum: [ config, override, default ]
    description: Where the effective URL lists came from. config when every list that is not built in comes from the configuration file. override when a PATCH set at least one list that is still in force, even to the URLs the file names. default when both assets use the engine's built-in URLs. An asset with neither a file value nor an override uses its built-in URLs under any source. A PATCH may set URLs under any source.
  GeoDataUrl:
    type: string
    format: uri
    maxLength: 4096
    pattern: ^https?://(?![^/?#]*@)[^#]*$
    description: Absolute HTTP(S) URL without userinfo or fragment, fetched under the outbound-request policy in api-config. The engine does not follow redirects.
  GeoDataSources:
    type: object
    required: [ urls ]
    properties:
      urls:
        type: array
        minItems: 1
        uniqueItems: true
        description: Download URLs in fallback order, at most resources.geodata.max_urls. Returned as written, with only listener-secret values masked, to every admitted caller; see the visibility table in api-config.
        items:
          $ref: ./openapi.yaml#/components/schemas/GeoDataUrl
  GeoDataAutoUpdate:
    type: object
    required: [ enabled, interval_hours ]
    description: When the engine takes file values (resources.geodata.lifecycle.file_values), a schedule the configuration file names replaces a stored one, and a schedule an earlier file set returns to the default when the file names none; a patched schedule is kept.
    properties:
      enabled:
        type: boolean
        default: true
        description: Update on a schedule. On by default.
      interval_hours:
        type: integer
        minimum: 1
        description: Hours between automatic updates, within resources.geodata.interval_hours, when cron is null or absent. Under a cron schedule it reads resources.geodata.interval_hours.default and has no effect. The engine may add a random delay; next_check_at reports the result.
      cron:
        type:
          - string
          - 'null'
        description: Five-field cron expression (minute hour day-of-month month day-of-week) evaluated in the engine's local time zone, or null when interval_hours applies. An engine without cron schedules omits it, and interval_hours then applies. The engine chooses the default and may add a random delay; next_check_at reports the result. An engine may accept fewer expressions than standard cron and refuses the rest with 400.
  GeoDataDownloadRoute:
    type: string
    enum: [ routing, group, direct ]
    description: How geodata downloads leave the device. routing follows the routing rules like user traffic, so a rule can send them to a node, a group, direct or block. group always goes through the group in group_id. direct connects straight to the host, outside the routing rules.
  GeoDataDownload:
    type: object
    required: [ route, group_id ]
    properties:
      route:
        $ref: ./openapi.yaml#/components/schemas/GeoDataDownloadRoute
      group_id:
        type: [ string, "null" ]
        minLength: 1
        description: The group for route group, as in GET /groups. Null for routing and direct, and when the stored group no longer exists; downloads then fail until the route is changed.
  GeoDataDownloadPatch:
    type: object
    additionalProperties: false
    required: [ route ]
    properties:
      route:
        $ref: ./openapi.yaml#/components/schemas/GeoDataDownloadRoute
      group_id:
        type: string
        minLength: 1
        description: A current group id; required for route group and not allowed otherwise.
    if:
      properties:
        route:
          const: group
    then:
      required: [ group_id ]
    else:
      not:
        required: [ group_id ]
  GeoDataSettings:
    type: object
    required: [ source, geosite, geoip, auto_update, download ]
    properties:
      source:
        $ref: ./openapi.yaml#/components/schemas/GeoDataSettingsSource
        description: Read-only; a patch cannot set it.
      geosite:
        $ref: ./openapi.yaml#/components/schemas/GeoDataSources
      geoip:
        $ref: ./openapi.yaml#/components/schemas/GeoDataSources
      auto_update:
        $ref: ./openapi.yaml#/components/schemas/GeoDataAutoUpdate
      download:
        $ref: ./openapi.yaml#/components/schemas/GeoDataDownload
        default: { route: routing, group_id: null }
        description: The route every geodata request takes. routing when nothing is stored, as for every download the engine makes itself. When the engine takes file values (resources.geodata.lifecycle.file_values), a route the configuration file names replaces a stored one, and a route an earlier file set returns to routing when the file names none; a patched route is kept. It does not affect source. A group that has no usable member when an update runs, for example just after startup before its health checks finish, fails that URL like a connection error; the engine tries the next URL and reports last_error, and never falls back to direct.
      verify_checksum:
        type: boolean
        description: Whether an update verifies each file by the resources.geodata.checksum method and rejects a file that does not match. true when nothing is set, and an engine that omits the field behaves as true. false sends no checksum request and accepts the file unverified, with verified false, for a mirror that answers the checksum URL with an error page or a status other than 404. When the engine takes file values, a value the configuration file names replaces a stored one, and a value an earlier file set returns to true when the file names none; a patched value is kept.
  GeoDataSourcesPatch:
    type: object
    additionalProperties: false
    required: [ urls ]
    properties:
      urls:
        type: array
        minItems: 1
        uniqueItems: true
        description: Replaces the whole list; order is fallback order. At most resources.geodata.max_urls; a longer list returns 400.
        items:
          $ref: ./openapi.yaml#/components/schemas/GeoDataUrl
  GeoDataSettingsPatch:
    description: Merged into the current settings as overrides. A patch with geosite or geoip overrides only that list, so source becomes override, under any source; the other list is unchanged. auto_update, download and verify_checksum are each overridden on their own. null removes every override and every value taken from the configuration file until the engine next takes file values.
    oneOf:
      - type: "null"
      - type: object
        additionalProperties: false
        minProperties: 1
        properties:
          geosite:
            $ref: ./openapi.yaml#/components/schemas/GeoDataSourcesPatch
          geoip:
            $ref: ./openapi.yaml#/components/schemas/GeoDataSourcesPatch
          download:
            $ref: ./openapi.yaml#/components/schemas/GeoDataDownloadPatch
          verify_checksum:
            type: boolean
          auto_update:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              enabled:
                type: boolean
              interval_hours:
                type: integer
                minimum: 1
                description: Within resources.geodata.interval_hours; a value outside it returns 400. Switches to the interval schedule.
              cron:
                type: string
                minLength: 1
                description: Switches to the cron schedule. Five fields, as in GeoDataAutoUpdate.cron. An expression the engine refuses, for example one it cannot parse, one it limits or one that never fires, returns 400.
            not:
              required: [ interval_hours, cron ]
              properties:
                interval_hours: {}
                cron: {}
  GeoDataUpdateAccepted:
    allOf:
      - $ref: ./openapi.yaml#/components/schemas/OperationAccepted
      - type: object
        properties:
          kind:
            const: geodata_update
  GeoDataUpdateSucceededOperation:
    allOf:
      - $ref: ./openapi.yaml#/components/schemas/OperationCommon
      - type: object
        properties:
          kind:
            const: geodata_update
          status:
            const: succeeded
          finished_at:
            $ref: ./openapi.yaml#/components/schemas/Timestamp
          result:
            $ref: ./openapi.yaml#/components/schemas/GeoData
          error:
            type: "null"
