paths:
  /api/v1/providers:
    get:
      operationId: listProviders
      tags: [ Providers ]
      summary: List provider metadata
      description: |
        Read current subscription, file and inline provider metadata; never fetch a
        subscription while serving a GET. Use the shared snapshot cursor semantics.
        The effective default limit is min(100, resources.providers.max_page_size).
        A limit above the advertised maximum returns 400 invalid_request. The
        Cursor parameter defines how an unusable cursor is answered.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/Limit1000
        - $ref: ./openapi.yaml#/components/parameters/Cursor
      responses:
        "200":
          description: Provider page
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ProviderList
              examples:
                providers:
                  value:
                    providers:
                      - id: provider-a
                        name: provider-a
                        kind: subscription
                        url_redacted: https://subscriptions.example.com/a/sub?token=secret-a
                        node_count: 1
                        updated_at: 2026-08-15T10:00:00Z
                        expires_at: 2026-10-01T00:00:00Z
                        traffic:
                          upload_bytes: "1048576"
                          download_bytes: "2097152"
                          total_bytes: "107374182400"
                        status: ok
                        last_error: null
                        download: { route: routing, group_id: null }
                    next_cursor: null
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "410":
          $ref: ./openapi.yaml#/components/responses/SnapshotExpired
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
        "503":
          $ref: ./openapi.yaml#/components/responses/SnapshotUnavailable
    post:
      operationId: createProvider
      tags: [ Providers ]
      summary: Add a subscription provider to the managed configuration
      description: |
        Requires resources.providers.can_manage; otherwise returns 404
        capability_not_supported. Only kind subscription can be created here: file and
        inline providers are authored in the configuration sources. The engine writes
        the provider into the subscription section of its managed main source,
        advances the configuration revision, and emits generation.changed. A later
        replacement of that main source using its previous content_sha256 returns
        412 stale_revision. When resources.providers.create_unfetched is true, the provider is
        created unfetched: node_count 0, updated_at null and status stale; call
        POST /providers/{provider_id}/refresh to load it. Otherwise the engine may fetch the
        provider during activation and returns its actual state. The response carries the
        URL in url_redacted, as written apart from listener secrets. A name already in use
        returns 409 state_conflict, as does a configuration change while the create is
        being admitted. A URL that is not HTTP(S) returns 422 unsupported_value.
        update_interval, user_agent and cache are accepted only when named in
        resources.providers.create_options; an omitted one takes the default listed there,
        and one the engine does not list returns 422 unsupported_value.
        Returns 201 with the provider once the change is active, or 202 with a
        provider_create operation whose result is the created provider. A
        failed activation reports its outcome as defined under activation
        outcomes in the error contract.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./openapi.yaml#/components/schemas/ProviderCreate
            examples:
              subscription:
                value:
                  name: provider-b
                  kind: subscription
                  url: https://subscriptions.example.com/sub?token=secret
              options:
                value:
                  name: provider-c
                  kind: subscription
                  url: https://subscriptions.example.com/sub?token=secret
                  update_interval: 3600
                  user_agent: clash.meta
                  cache: false
      responses:
        "202":
          description: Provider creation accepted as a provider_create operation
          headers:
            Location:
              description: Operation status URL; equal to body href.
              required: true
              schema:
                type: string
                pattern: ^/api/v1/operations/[^/]+$
            Retry-After:
              description: Positive polling floor in seconds.
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/OperationAccepted
              examples:
                queued:
                  value:
                    operation_id: op-01HZX4K8WD
                    kind: provider_create
                    status: queued
                    href: /api/v1/operations/op-01HZX4K8WD
                  x-headers:
                    Content-Type: application/json
                    Location: /api/v1/operations/op-01HZX4K8WD
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "201":
          description: Provider written to the managed configuration and active
          headers:
            Location:
              description: The new provider's URL.
              required: true
              schema:
                type: string
                pattern: ^/api/v1/providers/[^/]+$
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Provider
              examples:
                created:
                  value:
                    id: provider-b
                    name: provider-b
                    kind: subscription
                    url_redacted: https://subscriptions.example.com/sub?token=secret
                    node_count: 0
                    updated_at: null
                    expires_at: null
                    traffic: null
                    status: stale
                    last_error: null
                    download: { route: routing, group_id: null }
                  x-headers:
                    Content-Type: application/json
                    Location: /api/v1/providers/provider-b
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "409":
          description: A provider with this name exists, or the configuration changed while the create was being admitted (state_conflict)
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                name_taken:
                  value:
                    error:
                      code: state_conflict
                      message: A provider named provider-b already exists.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "413":
          description: Request body exceeds limits.max_json_body_bytes
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                too_large:
                  value:
                    error:
                      code: request_too_large
                      message: The request body exceeds the advertised limit.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "415":
          description: Request body is not application/json
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                unsupported:
                  value:
                    error:
                      code: unsupported_media_type
                      message: The request body must be application/json.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "422":
          description: The URL is not an http(s) URL
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                bad_url:
                  value:
                    error:
                      code: unsupported_value
                      message: The subscription URL must start with http:// or https://.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
  /api/v1/providers/{provider_id}:
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/ProviderId
    get:
      operationId: getProvider
      tags: [ Providers ]
      summary: Read one provider's current metadata
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Provider metadata; reading does not refresh it
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Provider
              examples:
                subscription:
                  value:
                    id: provider-a
                    name: provider-a
                    kind: subscription
                    url_redacted: https://subscriptions.example.com/a/sub?token=secret-a
                    node_count: 1
                    updated_at: 2026-08-15T10:00:00Z
                    expires_at: 2026-10-01T00:00:00Z
                    traffic:
                      upload_bytes: "1048576"
                      download_bytes: "2097152"
                      total_bytes: "107374182400"
                    status: ok
                    last_error: null
                    download: { route: routing, group_id: null }
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
    delete:
      operationId: deleteProvider
      tags: [ Providers ]
      summary: Remove a subscription or file provider from the managed configuration
      description: |
        Requires resources.providers.can_manage; otherwise returns 404
        capability_not_supported, as does an inline provider, which is the node
        section itself. Removes the provider's line from the managed main source and
        its nodes from the running groups, advances the configuration revision and
        emits generation.changed. Idempotent: an unknown id returns deleted 0. A
        provider that is the only member source of a group is still removed; the
        group is then empty. Returns 200 once the change is active, or 202 with
        a provider_delete operation whose result is the same deletion count. A
        failed activation reports its outcome as defined under activation
        outcomes in the error contract.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      responses:
        "202":
          description: Provider deletion accepted as a provider_delete operation
          headers:
            Location:
              description: Operation status URL; equal to body href.
              required: true
              schema:
                type: string
                pattern: ^/api/v1/operations/[^/]+$
            Retry-After:
              description: Positive polling floor in seconds.
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/OperationAccepted
              examples:
                queued:
                  value:
                    operation_id: op-01HZX4K8WE
                    kind: provider_delete
                    status: queued
                    href: /api/v1/operations/op-01HZX4K8WE
                  x-headers:
                    Content-Type: application/json
                    Location: /api/v1/operations/op-01HZX4K8WE
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "200":
          description: Idempotent deletion result
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/DeleteCount
              examples:
                deleted:
                  value:
                    deleted: 1
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "409":
          $ref: ./openapi.yaml#/components/responses/Conflict
          description: The configuration still names the provider in a reference the delete would break, or the configuration changed while the delete was being admitted (state_conflict); nothing is removed. Filter-matched membership is not a reference. After a concurrent change, read the provider back and retry.
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
  /api/v1/providers/{provider_id}/refresh:
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/ProviderId
    post:
      operationId: refreshProvider
      tags: [ Providers ]
      summary: Queue a provider refresh
      description: |
        Requires resources.providers.can_refresh. This action takes no request body
        and never changes the provider's configured source. Unsupported provider kinds
        or refresh actions return 404 capability_not_supported. Follow the shared
        operation ownership, retention and idempotency rules. Replaying an accepted
        Idempotency-Key returns its original operation before checking for an in-flight
        refresh; a distinct refresh for the same provider returns 409 state_conflict.
        A full bounded queue returns 503 temporarily_unavailable with Retry-After.
        A successful provider_refresh operation returns the refreshed Provider in result;
        failure uses SafeError and leaves the last successfully loaded nodes intact.
        The fetch takes the provider's download route. When that route has no usable
        node yet, as when the routing rules send a subscription to a group of the nodes
        it has not delivered, the fetch fails with route_unavailable and never falls
        back to direct.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/IdempotencyKey
      responses:
        "202":
          description: Provider refresh accepted
          headers:
            Location:
              description: Operation status URL; equal to body href.
              required: true
              schema:
                type: string
                pattern: ^/api/v1/operations/[^/]+$
            Retry-After:
              description: Positive polling floor in seconds.
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ProviderRefreshAccepted
              examples:
                queued:
                  value:
                    operation_id: op-provider-a
                    kind: provider_refresh
                    status: queued
                    href: /api/v1/operations/op-provider-a
                  x-headers:
                    Content-Type: application/json
                    Location: /api/v1/operations/op-provider-a
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "409":
          description: Another refresh for this provider is queued or running, or an idempotency key conflicts
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                in_flight:
                  value:
                    error:
                      code: state_conflict
                      message: A refresh for this provider is already queued or running.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
                idempotency_conflict:
                  value:
                    error:
                      code: idempotency_conflict
                      message: The idempotency key was used with a different request.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
        "429":
          $ref: ./openapi.yaml#/components/responses/RateLimited
        "503":
          description: Provider refresh queue is full
          headers:
            Retry-After:
              description: Retry delay in seconds.
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                queue_full:
                  value:
                    error:
                      code: temporarily_unavailable
                      message: The provider refresh queue is full.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
schemas:
  Provider:
    type: object
    required: [ id, name, kind, url_redacted, node_count, updated_at, expires_at, traffic, status, last_error ]
    properties:
      id:
        type: string
        minLength: 1
        description: Opaque provider identity, shared with Node.provider_id; not a URL or display name.
      name:
        type: string
        minLength: 1
      kind:
        type: string
        enum: [ subscription, file, inline ]
      url_redacted:
        type: [ string, "null" ]
        minLength: 1
        description: The configured source URL as written, with only listener-secret values masked; subscription credentials in it are returned. Null for file/inline sources. The wire name is kept for compatibility.
      node_count:
        $ref: ./openapi.yaml#/components/schemas/SafeUInt
      updated_at:
        $ref: ./openapi.yaml#/components/schemas/NullableTimestamp
        description: Last successful load or refresh, or null if unknown or never loaded.
      expires_at:
        $ref: ./openapi.yaml#/components/schemas/NullableTimestamp
        description: Provider-reported expiry, or null when unavailable.
      traffic:
        oneOf:
          - type: "null"
          - $ref: ./openapi.yaml#/components/schemas/ProviderTraffic
      status:
        type: string
        enum: [ ok, stale, error ]
        description: ok means current usable data is loaded. stale means the provider has not been fetched or retains older usable data. error means a failed load left no usable data.
      last_error:
        oneOf:
          - type: "null"
          - $ref: ./openapi.yaml#/components/schemas/SafeError
        description: The last failure, or null. A subscription fetch whose download route has no usable node yet reports code route_unavailable; other fetch failures report fetch_failed.
      download:
        description: The route a subscription's fetches take, with the values of the geodata download route. routing follows the routing rules like user traffic, group always goes through the group in group_id, and direct connects straight to the host. group_id is null for routing and direct and for a group that no longer exists. Null for file and inline providers. Engines that fetch subscriptions only directly omit it.
        oneOf:
          - type: "null"
          - $ref: ./openapi.yaml#/components/schemas/GeoDataDownload
    description: Provider metadata, visible as the visibility table in api-config describes. url_redacted is the configured URL with only listener-secret values masked; last_error is safe text without raw configuration.
  ProviderTraffic:
    type: object
    required: [ upload_bytes, download_bytes, total_bytes ]
    properties:
      upload_bytes:
        $ref: ./openapi.yaml#/components/schemas/NullableUInt64
      download_bytes:
        $ref: ./openapi.yaml#/components/schemas/NullableUInt64
      total_bytes:
        $ref: ./openapi.yaml#/components/schemas/NullableUInt64
        description: Provider-reported total traffic allowance, not upload plus download. Null if unknown or unlimited.
    description: Provider-reported usage, not runtime counters. Each unavailable quantity is null; traffic itself may be null when no usage metadata exists.
  ProviderCreate:
    type: object
    additionalProperties: false
    required: [ name, kind, url ]
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 64
        description: The subscription tag as written in the configuration; unique among providers. Any text without control characters that the configuration can quote; a name outside `[A-Za-z0-9_.-]` is written quoted.
      kind:
        type: string
        const: subscription
      url:
        type: string
        minLength: 1
        maxLength: 4096
        pattern: ^https?://
        description: Fetched by the engine on refresh and stored in the managed main source; returned in url_redacted as written, apart from listener secrets.
      update_interval:
        type: integer
        minimum: 0
        maximum: 31536000
        description: Seconds between automatic refreshes; 0 refreshes only on request.
      user_agent:
        type: string
        minLength: 1
        maxLength: 256
        pattern: ^[\x20-\x7E]+$
        description: User-Agent header sent when fetching the URL.
      cache:
        type: boolean
        description: Keep the last fetched body so the provider loads without the network at startup. false keeps none and removes a kept one.
  ProviderList:
    type: object
    required: [ providers, next_cursor ]
    properties:
      providers:
        type: array
        items:
          $ref: ./openapi.yaml#/components/schemas/Provider
      next_cursor:
        type: [ string, "null" ]
        minLength: 1
  ProviderRefreshAccepted:
    allOf:
      - $ref: ./openapi.yaml#/components/schemas/OperationAccepted
      - type: object
        properties:
          kind:
            const: provider_refresh
  ProviderRefreshSucceededOperation:
    allOf:
      - $ref: ./openapi.yaml#/components/schemas/OperationCommon
      - type: object
        properties:
          kind:
            const: provider_refresh
          status:
            const: succeeded
          finished_at:
            $ref: ./openapi.yaml#/components/schemas/Timestamp
          result:
            $ref: ./openapi.yaml#/components/schemas/Provider
          error:
            type: "null"
  ProviderCreateSucceededOperation:
    allOf:
      - $ref: ./openapi.yaml#/components/schemas/OperationCommon
      - type: object
        properties:
          kind:
            const: provider_create
          status:
            const: succeeded
          finished_at:
            $ref: ./openapi.yaml#/components/schemas/Timestamp
          result:
            $ref: ./openapi.yaml#/components/schemas/Provider
          error:
            type: "null"
  ProviderDeleteSucceededOperation:
    allOf:
      - $ref: ./openapi.yaml#/components/schemas/OperationCommon
      - type: object
        properties:
          kind:
            const: provider_delete
          status:
            const: succeeded
          finished_at:
            $ref: ./openapi.yaml#/components/schemas/Timestamp
          result:
            $ref: ./openapi.yaml#/components/schemas/DeleteCount
          error:
            type: "null"
