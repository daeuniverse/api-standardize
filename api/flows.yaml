paths:
  /api/v1/connections:
    get:
      operationId: listConnections
      summary: Read a scope-labelled live connection snapshot
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [ tcp, udp, all ]
            default: all
        - name: src
          in: query
          description: Exact source IP literal, without a port; applied with type before limit. Totals and truncated describe only matching visible entries.
          schema:
            $ref: ./openapi.yaml#/components/schemas/IpAddress
          example: 192.168.1.100
        - $ref: ./openapi.yaml#/components/parameters/Limit1000
        - $ref: ./openapi.yaml#/components/parameters/Detail
      responses:
        "200":
          description: Connection snapshot
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ConnectionList
              examples:
                visible:
                  value:
                    observed_at: 2026-08-15T10:00:00Z
                    instance_id: instance-7
                    visibility: partial
                    truncated: false
                    tcp:
                      - id: tcp-01HZX4K8W5
                        flow_id: flow-23
                        pname: curl
                        state: active
                        src: 192.168.1.100:12345
                        dst: 1.2.3.4:443
                        domain: example.com
                        outbound: proxy
                        chain: [ group-proxy, node-hk-01 ]
                        chain_source: evaluation
                        rule_id: null
                        rule_expression: null
                        rule_source: unknown
                        ingress: wan
                        domain_source: tls_sni
                        started_at: 2026-08-15T09:59:50Z
                        observed_by: userspace
                        upload_bytes: "20480"
                        download_bytes: "1048576"
                        upload_bytes_per_second: "4096"
                        download_bytes_per_second: "32768"
                    udp:
                      - id: udp-01HZX4K8W6
                        flow_id: null
                        pname: null
                        state: unknown
                        src: 192.168.1.100:5353
                        dst: 8.8.8.8:53
                        domain: null
                        outbound: direct
                        chain: []
                        chain_source: unknown
                        rule_id: null
                        rule_expression: null
                        rule_source: unknown
                        ingress: null
                        domain_source: null
                        started_at: 2026-08-15T09:59:55Z
                        observed_by: ebpf
                        upload_bytes: null
                        download_bytes: null
                        upload_bytes_per_second: null
                        download_bytes_per_second: null
                    total_tcp: 1
                    total_udp: 1
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
    delete:
      operationId: closeConnections
      summary: Close matching userspace-owned connections
      description: |
        Requires control permission and resources.connections.available with
        resources.connections.can_close; unavailable closing returns 404
        capability_not_supported.

        Combine type and exact source-IP src filters with AND. Missing type and
        type=all do not restrict the set. Without type=tcp, type=udp, or src,
        require all=true or return 400 invalid_request before closing anything.
        all=true does not override supplied filters. Reject limit and detail,
        which apply only to listing.

        Select matching live entries once. If their count, including non-closable
        entries, exceeds resources.connections.max_bulk_close, return 413
        request_too_large without closing anything. Close all closable matches and
        count non-closable matches as skipped. An empty set returns closed=0 and
        skipped=0. Exclude later arrivals and selected entries that disappear before
        cancellation; disappeared entries contribute to neither count.

        A connection is closable only when the userspace datapath owns and can
        cancel its TCP transport or retire its UDP session. Deleting a tracker
        entry is insufficient. observed_by and the outbound name do not establish
        ownership. Kernel-direct and kernel-bypassed flows, including ebpf-only
        observations, are not closable.

        Idempotency-Key is accepted, but every call evaluates current live state;
        repeated keys do not replay results or return an operation.

        For recorded flows, closing advances terminal state and emits flow.updated
        when advertised. Fetch the event's href and refresh /connections. Changed
        runtime counters use runtime.updated. Existing coalescing and retention
        rules apply. Do not fabricate a flow ID or flow event for an unrecorded
        connection.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/paths/~1api~1v1~1connections/get/parameters/0"
        - $ref: "#/paths/~1api~1v1~1connections/get/parameters/1"
        - name: all
          in: query
          description: Explicitly permit an unfiltered close; does not override type or src.
          schema:
            type: boolean
            default: false
        - $ref: ./openapi.yaml#/components/parameters/IdempotencyKey
      responses:
        "200":
          description: Bulk-close counts; entries that disappeared before cancellation are excluded.
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/BulkCloseResult
              examples:
                closed:
                  value:
                    closed: 2
                    skipped: 1
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          description: Invalid parameters, or an unfiltered close without all=true; no connections closed.
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                unfiltered:
                  value:
                    error:
                      code: invalid_request
                      message: Supply type=tcp, type=udp, or src, or explicitly pass all=true.
                      details: null
                    request_id: request-close-1
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          description: Connection closing is unavailable (capability_not_supported).
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                unsupported:
                  value:
                    error:
                      code: capability_not_supported
                      message: Connection closing is unavailable.
                      details: null
                    request_id: request-close-3
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
          description: Matching live entries exceed max_bulk_close (request_too_large); no connections closed.
        "503":
          description: |
            Closing at least one selected connection could not be confirmed
            (temporarily_unavailable). error.details counts the connections already
            closed or skipped; they stay closed, so a retry must not assume nothing changed.
          headers:
            Retry-After:
              description: Retry delay in seconds.
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ./openapi.yaml#/components/schemas/ErrorResponse
                  - type: object
                    properties:
                      error:
                        type: object
                        required: [ details ]
                        properties:
                          details:
                            $ref: ./openapi.yaml#/components/schemas/BulkCloseResult
              examples:
                incomplete:
                  value:
                    error:
                      code: temporarily_unavailable
                      message: Transport retirement could not be confirmed.
                      details:
                        closed: 2
                        skipped: 1
                    request_id: request-close-5
                  x-headers:
                    Content-Type: application/json
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
  /api/v1/connections/{connection_id}:
    delete:
      operationId: closeConnection
      summary: Close one userspace-owned connection
      description: |
        Requires control permission and resources.connections.available with
        resources.connections.can_close; unavailable closing returns 404
        capability_not_supported.

        The userspace datapath must own and be able to cancel the TCP transport or
        retire the UDP session. Tracker deletion, observed_by, and the outbound name
        do not establish ownership. Kernel-direct and kernel-bypassed flows, including
        ebpf-only observations, are not closable. An observed non-closable connection
        returns 409 state_conflict.

        Return 204 with no body only after cancellation or retirement. Unknown or
        already-gone IDs return 404 resource_not_found. Idempotency-Key is accepted,
        but each call evaluates current live state; a repeated close returns 404
        rather than replaying 204 or returning an operation.

        For recorded flows, closing advances terminal state and emits flow.updated
        when advertised. Fetch the event's href and refresh /connections. Changed
        runtime counters use runtime.updated. Existing coalescing and retention
        rules apply. Do not fabricate a flow ID or flow event for an unrecorded
        connection.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/ConnectionId
        - $ref: ./openapi.yaml#/components/parameters/IdempotencyKey
      responses:
        "204":
          description: Connection closed; no response body or Content-Type.
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          x-examples:
            closed:
              x-headers:
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          description: Unknown or already-gone ID (resource_not_found), or closing unavailable (capability_not_supported).
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                gone:
                  value:
                    error:
                      code: resource_not_found
                      message: Connection is unknown or already gone.
                      details: null
                    request_id: request-close-2
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
                unsupported:
                  value:
                    error:
                      code: capability_not_supported
                      message: Connection closing is unavailable.
                      details: null
                    request_id: request-close-3
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "409":
          description: Observed connection is not owned by a cancellable userspace transport/session (state_conflict).
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                not_closable:
                  value:
                    error:
                      code: state_conflict
                      message: The connection is observed by eBPF but its transport is not owned by userspace.
                      details: null
                    request_id: request-close-4
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
          description: Cancellation or retirement could not be confirmed (temporarily_unavailable); the connection may already be closed.
