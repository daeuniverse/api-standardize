schemas:
  BulkCloseResult:
    type: object
    required: [ closed, skipped ]
    description: Bounded JSON-number counts; closed + skipped cannot exceed resources.connections.max_bulk_close.
    properties:
      closed:
        $ref: ./openapi.yaml#/components/schemas/SafeUInt
        description: Selected connections actually cancelled or retired by the userspace datapath.
      skipped:
        $ref: ./openapi.yaml#/components/schemas/SafeUInt
        description: Selected connections observed but not closable; excludes entries that disappeared before cancellation.
  ConnectionState:
    type: string
    enum: [ observed, routing, dialing, active, closed, blocked, failed, unknown ]
  Connection:
    type: object
    required: [ id, flow_id, pname, state, outbound, chain, chain_source, rule_id, rule_expression, rule_source, ingress, domain_source, started_at, observed_by, upload_bytes, download_bytes, upload_bytes_per_second, download_bytes_per_second ]
    properties:
      id:
        type: string
        minLength: 1
      flow_id:
        type: [ string, "null" ]
      pname:
        type: [ string, "null" ]
      state:
        $ref: ./openapi.yaml#/components/schemas/ConnectionState
      src:
        type: string
        minLength: 1
      dst:
        type: string
        minLength: 1
      domain:
        type: [ string, "null" ]
      outbound:
        type: [ string, "null" ]
      chain:
        type: array
        items:
          type: string
        description: Application outbound selection_path group IDs followed by the leaf node ID, in order; empty for direct/block or an unknown path.
      chain_source:
        type: string
        enum: [ evaluation, reconstructed, unknown ]
        description: Selection captured at evaluation, reconstructed from retained evidence, or unavailable; never a current group snapshot.
      rule_id:
        type: [ string, "null" ]
        description: Generation-scoped traffic rule ID, or null when unavailable.
      rule_expression:
        type: [ string, "null" ]
        description: Sanitized display expression for that rule, or null when unavailable.
      rule_source:
        type: string
        enum: [ kernel, recomputed, unknown ]
        description: Deciding kernel rule, recomputed userspace evidence, or unavailable provenance; see honk-mapping's matched_rule row.
      ingress:
        type: [ string, "null" ]
        enum: [ lan, wan, null ]
      domain_source:
        oneOf:
          - type: "null"
          - $ref: ./openapi.yaml#/components/schemas/DomainSource
      started_at:
        $ref: ./openapi.yaml#/components/schemas/NullableTimestamp
      observed_by:
        $ref: ./openapi.yaml#/components/schemas/ObservedBy
      upload_bytes:
        $ref: ./openapi.yaml#/components/schemas/NullableUInt64
      download_bytes:
        $ref: ./openapi.yaml#/components/schemas/NullableUInt64
      upload_bytes_per_second:
        $ref: ./openapi.yaml#/components/schemas/NullableUInt64
        description: Visible upload rate, or null when the adapter does not sample per connection. See connections.md for deriving a rate from two list snapshots.
      download_bytes_per_second:
        $ref: ./openapi.yaml#/components/schemas/NullableUInt64
        description: Visible download rate, or null when the adapter does not sample per connection. See connections.md for deriving a rate from two list snapshots.
  ConnectionList:
    type: object
    required: [ observed_at, instance_id, visibility, truncated, tcp, udp, total_tcp, total_udp ]
    properties:
      observed_at:
        $ref: ./openapi.yaml#/components/schemas/Timestamp
      instance_id:
        type: string
        minLength: 1
      visibility:
        $ref: ./openapi.yaml#/components/schemas/Visibility
      truncated:
        type: boolean
        description: Whether limit omitted visible entries matching type and src.
      tcp:
        type: array
        items:
          $ref: ./openapi.yaml#/components/schemas/Connection
      udp:
        type: array
        items:
          $ref: ./openapi.yaml#/components/schemas/Connection
      total_tcp:
        $ref: ./openapi.yaml#/components/schemas/SafeUInt
        description: Visible live TCP entries matching type and src before limit; zero when type excludes TCP.
      total_udp:
        $ref: ./openapi.yaml#/components/schemas/SafeUInt
        description: Visible live UDP entries matching type and src before limit; zero when type excludes UDP.
  FlowScope:
    type: string
    enum: [ userspace_tcp, userspace_udp, kernel_direct, kernel_block, dns_intercept, kernel_bypass ]
  TraceStatus:
    type: string
    enum: [ complete, partial, disabled ]
  FlowInput:
    type: object
    required: [ src, dst, domain, domain_source, pid, process_path, src_mac, ingress, domain_rule_ids, dscp, mark ]
    properties:
      src:
        type: [ string, "null" ]
      dst:
        type: [ string, "null" ]
      domain:
        type: [ string, "null" ]
      domain_source:
        oneOf:
          - type: "null"
          - $ref: ./openapi.yaml#/components/schemas/DomainSource
      pid:
        $ref: ./openapi.yaml#/components/schemas/NullableSafeUInt
      process_path:
        type: [ string, "null" ]
      src_mac:
        type: [ string, "null" ]
      ingress:
        type: [ string, "null" ]
        enum: [ lan, wan, null ]
      domain_rule_ids:
        oneOf:
          - type: "null"
          - type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
      dscp:
        type: [ integer, "null" ]
        minimum: 0
        maximum: 63
      mark:
        type: [ integer, "null" ]
        minimum: 0
        maximum: 4294967295
  DomainSource:
    type: string
    enum: [ tls_sni, http_host, quic_sni, dns_mapping, explicit, unknown ]
  FlowSummary:
    type: object
    required: [ id, instance_id, revision, network, state, pname, connection_id, outbound, chain, chain_source, rule_id, rule_expression, rule_source, ingress, domain_source, observed_by, started_at, ended_at, trace_status ]
    properties:
      id:
        type: string
        minLength: 1
      instance_id:
        type: string
        minLength: 1
      revision:
        type: integer
        minimum: 1
        maximum: 9007199254740991
      network:
        $ref: ./openapi.yaml#/components/schemas/Transport
      state:
        $ref: ./openapi.yaml#/components/schemas/ConnectionState
      pname:
        type: [ string, "null" ]
      connection_id:
        type: [ string, "null" ]
      outbound:
        type: [ string, "null" ]
      chain:
        type: array
        items:
          type: string
        description: Application outbound selection_path group IDs followed by the leaf node ID, in order; empty for direct/block or an unknown path.
      chain_source:
        type: string
        enum: [ evaluation, reconstructed, unknown ]
        description: Selection captured at evaluation, reconstructed from retained evidence, or unavailable; never a current group snapshot.
      rule_id:
        type: [ string, "null" ]
        description: Generation-scoped traffic rule ID, or null when unavailable.
      rule_expression:
        type: [ string, "null" ]
        description: Sanitized display expression for that rule, or null when unavailable.
      rule_source:
        type: string
        enum: [ kernel, recomputed, unknown ]
        description: Deciding kernel rule, recomputed userspace evidence, or unavailable provenance; see honk-mapping's matched_rule row.
      ingress:
        type: [ string, "null" ]
        enum: [ lan, wan, null ]
      domain_source:
        oneOf:
          - type: "null"
          - $ref: ./openapi.yaml#/components/schemas/DomainSource
      observed_by:
        $ref: ./openapi.yaml#/components/schemas/ObservedBy
      started_at:
        $ref: ./openapi.yaml#/components/schemas/NullableTimestamp
      ended_at:
        $ref: ./openapi.yaml#/components/schemas/NullableTimestamp
      trace_status:
        $ref: ./openapi.yaml#/components/schemas/TraceStatus
      input:
        $ref: ./openapi.yaml#/components/schemas/FlowInput
  FlowCoverage:
    type: object
    required: [ userspace_tcp, userspace_udp, kernel_direct, kernel_block, dns_intercept, kernel_bypass ]
    properties:
      userspace_tcp:
        $ref: ./openapi.yaml#/components/schemas/Visibility
      userspace_udp:
        $ref: ./openapi.yaml#/components/schemas/Visibility
      kernel_direct:
        $ref: ./openapi.yaml#/components/schemas/Visibility
      kernel_block:
        $ref: ./openapi.yaml#/components/schemas/Visibility
      dns_intercept:
        $ref: ./openapi.yaml#/components/schemas/Visibility
      kernel_bypass:
        $ref: ./openapi.yaml#/components/schemas/Visibility
  FlowList:
    type: object
    required: [ instance_id, observed_at, coverage, dropped_records, flows, next_cursor ]
    properties:
      instance_id:
        type: string
        minLength: 1
      observed_at:
        $ref: ./openapi.yaml#/components/schemas/Timestamp
      coverage:
        $ref: ./openapi.yaml#/components/schemas/FlowCoverage
      dropped_records:
        $ref: ./openapi.yaml#/components/schemas/NullableUInt64
      flows:
        type: array
        items:
          $ref: ./openapi.yaml#/components/schemas/FlowSummary
      next_cursor:
        type: [ string, "null" ]
  FlowDetail:
    allOf:
      - $ref: ./openapi.yaml#/components/schemas/FlowSummary
      - type: object
        required: [ input, trace ]
        properties:
          input:
            $ref: ./openapi.yaml#/components/schemas/FlowInput
          trace:
            $ref: ./openapi.yaml#/components/schemas/FlowTrace
        not:
          required: [ mode ]
      - oneOf:
          - properties:
              trace_status:
                const: complete
              trace:
                properties:
                  status:
                    const: complete
          - properties:
              trace_status:
                const: partial
              trace:
                properties:
                  status:
                    const: partial
          - properties:
              trace_status:
                const: disabled
              trace:
                properties:
                  status:
                    const: disabled
    description: Recorded evidence identified by id and instance_id; never a simulation.
  FlowTrace:
    type: object
    required: [ status, missing, steps ]
    properties:
      status:
        $ref: ./openapi.yaml#/components/schemas/TraceStatus
      missing:
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [ not_instrumented, started_late, buffer_overflow, sampled, redacted, evicted ]
      steps:
        type: array
        items:
          $ref: ./openapi.yaml#/components/schemas/FlowStep
    if:
      properties:
        status:
          const: complete
    then:
      properties:
        missing:
          maxItems: 0
        steps:
          items:
            properties:
              evidence:
                const: observed
            if:
              properties:
                stage:
                  const: route
            then:
              properties:
                data:
                  properties:
                    input:
                      type: object
    else:
      properties:
        missing:
          minItems: 1
  FlowStep:
    oneOf:
      - $ref: ./openapi.yaml#/components/schemas/InputStep
      - $ref: ./openapi.yaml#/components/schemas/RouteStep
      - $ref: ./openapi.yaml#/components/schemas/DatapathStep
      - $ref: ./openapi.yaml#/components/schemas/DialModeStep
      - $ref: ./openapi.yaml#/components/schemas/DnsStep
      - $ref: ./openapi.yaml#/components/schemas/RerouteStep
      - $ref: ./openapi.yaml#/components/schemas/OutboundStep
      - $ref: ./openapi.yaml#/components/schemas/ConnectionStep
    discriminator:
      propertyName: stage
      mapping:
        input: ./openapi.yaml#/components/schemas/InputStep
        route: ./openapi.yaml#/components/schemas/RouteStep
        datapath: ./openapi.yaml#/components/schemas/DatapathStep
        dial_mode: ./openapi.yaml#/components/schemas/DialModeStep
        dns: ./openapi.yaml#/components/schemas/DnsStep
        reroute: ./openapi.yaml#/components/schemas/RerouteStep
        outbound: ./openapi.yaml#/components/schemas/OutboundStep
        connection: ./openapi.yaml#/components/schemas/ConnectionStep
