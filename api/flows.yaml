              - $ref: ./openapi.yaml#/components/schemas/ConnectionState
              - const: all
            default: all
        - name: connection_id
          in: query
          description: Exact opaque connection ID within the current adapter instance; never inferred from a tuple. Matches active and retained terminal flows.
          schema:
            type: string
            minLength: 1
          example: tcp-01HZX4K8W5
        - $ref: ./openapi.yaml#/components/parameters/Limit1000
