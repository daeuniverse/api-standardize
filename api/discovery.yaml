paths:
  /api:
    get:
      operationId: getDiscovery
      tags: [ Discovery ]
      summary: Discover the native API
      description: >-
        Public in every auth mode, so a client can choose how to sign in. A
        caller the listener admits (a valid bearer or session, or no credential
        on an explicitly secretless loopback listener) receives the full view.
        Any other request without a credential receives the public view, which
        carries only the API name and major, the sign-in links, and the auth
        mode. A request that carries a credential is authenticated first: an
        invalid one gets 401, never the public view. No resource permission is
        required.
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Native API discovery
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Discovery
              examples:
                draft:
                  value:
                    name: daeuniverse/native
                    status: draft
                    api_major: 1
                    base_path: /api/v1
                    links:
                      version: /api/v1/version
                      capabilities: /api/v1/capabilities
                      config: /api/v1/config
                      config_validate: /api/v1/config/validate
                      runtime: /api/v1/runtime
                      runtime_outbounds: /api/v1/runtime/outbounds
                      traffic_history: /api/v1/runtime/traffic/history
                      memory_history: /api/v1/runtime/memory/history
                      logs: /api/v1/logs
                      providers: /api/v1/providers
                      rules: /api/v1/rules
                      geodata: /api/v1/geodata
                      operations: /api/v1/operations/{operation_id}
                      auth_setup: null
                      auth_login: null
                      auth_logout: null
                    auth:
                      mode: token
                      setup_required: false
                      anonymous_loopback: false
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
                public:
                  value:
                    name: daeuniverse/native
                    api_major: 1
                    links:
                      auth_setup: /api/v1/auth/setup
                      auth_login: /api/v1/auth/login
                    auth:
                      mode: password
                      setup_required: false
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
  /api/v1/version:
    get:
      operationId: getVersion
      tags: [ Discovery ]
      summary: Read native and engine version identity
      description: Requires bearer authentication when the listener has a deployment secret or runs in password mode. Anonymous access is permitted only on an explicitly secretless loopback listener. No resource permission is required.
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Version identity
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Version
              examples:
                build:
                  value:
                    api:
                      name: daeuniverse/native
                      major: 1
                      status: draft
                    engine:
                      name: honk
                      version: 0.0.1-alpha
                    build:
                      revision: abc1234
                      target: x86_64-unknown-linux-gnu
                      built_at: null
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [ Discovery ]
      summary: Negotiate resources, visibility, and limits
      description: Requires bearer authentication when the listener has a deployment secret or runs in password mode. Anonymous access is permitted only on an explicitly secretless loopback listener. No resource permission is required.
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Engine capabilities
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Capabilities
              examples:
                available:
                  value:
                    observed_at: 2026-08-15T10:00:00Z
                    profiles: [ base ]
                    limits:
                      max_request_target_bytes: 4096
                      max_header_bytes: 16384
                      max_json_body_bytes: 65536
                    resources:
                      config:
                        available: true
                        writable: true
                        create: true
                        max_bytes: 61440
                        max_sources: 32
                      config_validate:
                        available: true
                        modes: [ syntax, full ]
                        max_bytes: 65536
                        max_sources: 32
                      runtime:
                        available: true
                      runtime_memory:
                        available: true
                        metrics: [ process.rss_bytes, cgroup.current_bytes, cgroup.limit_bytes, cgroup.events.high, cgroup.events.oom, cgroup.events.oom_kill ]
                      runtime_outbounds:
                        available: true
                      traffic_history:
                        available: true
                        max_window_seconds: 3600
                        max_points: 360
                      memory_history:
                        available: true
                        max_window_seconds: 3600
                        max_points: 720
                      datapath:
                        available: true
                        kinds: [ ebpf ]
                        details: [ attachments, maps ]
                      nodes:
                        available: true
                        can_manage: true
                      providers:
                        available: true
                        can_refresh: true
                        can_manage: true
                        create_unfetched: true
                        create_options:
                          update_interval: 86400
                          user_agent: honk/0.0.1-alpha
                          cache: true
                        max_page_size: 1000
                      groups:
                        available: true
                        config_patch: true
                        selection: true
                        max_patch_operations: 32
                      probes:
                        available: true
                        targets: [ node, group ]
                        kinds: [ tcp_connect, http, dns ]
                        transports: [ tcp, udp ]
                        ip_versions: [ ipv4, ipv6 ]
                        limits:
                          max_members_per_job: 128
                          max_results_per_job: 512
                          max_active_jobs: 4
                          max_queued_jobs: 16
                          max_concurrent_per_target: 2
                          job_timeout_ms: 30000
                          per_principal_requests_per_minute: 60
                          global_requests_per_minute: 240
                      connections:
                        available: true
                        can_close: true
                        max_bulk_close: 1000
                      flows:
                        available: true
                        recording: auto
                        scopes: [ userspace_tcp, userspace_udp ]
                        min_flows: 64
                        max_flows: 10000
                        max_steps_per_flow: 256
                        retention_seconds: 300
                        snapshot_ttl_seconds: 30
                        max_page_size: 1000
                      routing_trace:
                        available: true
                        resolve_modes: [ none ]
                        max_addresses: 16
                        max_rule_steps: 4096
                        timeout_ms: 5000
                        per_principal_requests_per_minute: 30
                        global_requests_per_minute: 120
                      rules:
                        available: true
                        max_rules: 4096
                      events:
                        available: true
                        kinds: [ stream.ready, runtime.updated, flow.updated, flow.gap, operation.updated, generation.changed ]
                        retention_seconds: 60
                        max_buffered_events: 4096
                        max_clients: 16
                        heartbeat_seconds: 15
                      logs:
                        available: true
                        levels: [ trace, debug, info, warn, error ]
                        filters: [ level, target ]
                        retention_seconds: 60
                        min_buffered_records: 64
                        max_buffered_records: 4096
                      dns_query:
                        available: true
                        record_types: [ A, AAAA, HTTPS ]
                        limits:
                          max_types_per_request: 8
                          query_timeout_ms: 5000
                          max_response_bytes: 65536
                          per_principal_requests_per_minute: 120
                          global_requests_per_minute: 480
                      dns_cache:
                        available: true
                        read: true
                        delete_entry: true
                        delete_name: true
                        flush: true
                        entry_kinds: [ positive, negative ]
                      dns_log:
                        available: true
                        min_records: 64
                        max_records: 2048
                        max_page_size: 500
                      dns_rules:
                        available: true
                        max_rules: 4096
                      runtime_settings:
                        available: true
                        fields: [ log.level, log.buffered_records, dns_log.max_records, flows.max_flows, flows.retention_seconds, geodata ]
                      geodata:
                        available: true
                        can_update: true
                        assets: [ geosite, geoip ]
                        configurable_sources: true
                        max_urls: 4
                        interval_hours: { min: 6, max: 168, default: 24 }
                        checksum: sha256sum
                        lifecycle: { file_values: start, overrides_persist: true }
                      operations:
                        available: true
                        retention_seconds: 300
                        max_replay_keys: 1024
                      reload:
                        available: true
                      suspend:
                        available: false
                      resume:
                        available: false
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
schemas:
  Discovery:
    description: >-
      The full view for a caller the listener admits, or the public view for any
      other request without a credential.
    oneOf:
      - $ref: ./openapi.yaml#/components/schemas/AdmittedDiscovery
      - $ref: ./openapi.yaml#/components/schemas/PublicDiscovery
  PublicDiscovery:
    type: object
    description: >-
      What a client needs before it signs in. Status, base path, resource links,
      `auth_logout` and `auth.anonymous_loopback` are withheld.
    additionalProperties: false
    required: [ name, api_major, links, auth ]
    properties:
      name:
        type: string
        const: daeuniverse/native
      api_major:
        type: integer
        const: 1
      links:
        type: object
        additionalProperties: false
        required: [ auth_setup, auth_login ]
        properties:
          auth_setup:
            type: [ string, "null" ]
            enum: [ /api/v1/auth/setup, null ]
            description: Present in password mode, null otherwise.
          auth_login:
            type: [ string, "null" ]
            enum: [ /api/v1/auth/login, null ]
            description: Present in password mode, null otherwise.
      auth:
        type: object
        additionalProperties: false
        required: [ mode, setup_required ]
        properties:
          mode:
            type: string
            enum: [ token, password ]
          setup_required:
            type: boolean
  AdmittedDiscovery:
    type: object
    required: [ name, status, api_major, base_path, links, auth ]
    properties:
      name:
        type: string
        const: daeuniverse/native
      status:
        type: string
        const: draft
      api_major:
        type: integer
        const: 1
      base_path:
        type: string
        const: /api/v1
      links:
        type: object
        description: Shared links, plus an x-<engine> member for the engine's extension links (see capabilities, Engine extensions). Other members are not allowed.
        additionalProperties: false
        patternProperties:
          ^x-[a-z][a-z0-9]*$:
            type: object
            additionalProperties:
              type: string
              pattern: ^/api/v1/x-[a-z][a-z0-9]*/
        required: [ version, capabilities, config, config_validate, runtime, runtime_outbounds, traffic_history, memory_history, logs, providers, rules, operations, geodata ]
        properties:
          version:
            type: string
            const: /api/v1/version
          capabilities:
            type: string
            const: /api/v1/capabilities
          config:
            type: string
            const: /api/v1/config
          config_validate:
            type: string
            const: /api/v1/config/validate
          runtime:
            type: string
            const: /api/v1/runtime
          runtime_outbounds:
            type: string
            const: /api/v1/runtime/outbounds
          traffic_history:
            type: string
            const: /api/v1/runtime/traffic/history
          memory_history:
            type: string
            const: /api/v1/runtime/memory/history
          logs:
            type: string
            const: /api/v1/logs
          providers:
            type: string
            const: /api/v1/providers
          rules:
            type: string
            const: /api/v1/rules
          geodata:
            type: string
            const: /api/v1/geodata
          operations:
            type: string
            const: /api/v1/operations/{operation_id}
          auth_setup:
            type: [ string, "null" ]
            enum: [ /api/v1/auth/setup, null ]
            description: Present in password mode, null otherwise.
          auth_login:
            type: [ string, "null" ]
            enum: [ /api/v1/auth/login, null ]
            description: Present in password mode, null otherwise.
          auth_logout:
            type: [ string, "null" ]
            enum: [ /api/v1/auth/logout, null ]
            description: Present in password mode, null otherwise.
      auth:
        $ref: ./openapi.yaml#/components/schemas/AuthDiscovery
  Version:
    type: object
    required: [ api, engine ]
    properties:
      api:
        type: object
        required: [ name, major, status ]
        properties:
          name:
            type: string
            const: daeuniverse/native
          major:
            type: integer
            const: 1
          status:
            type: string
            const: draft
      engine:
        type: object
        required: [ name, version ]
        properties:
          name:
            type: string
            pattern: ^[a-z][a-z0-9]*$
            maxLength: 32
            description: Lowercase engine name, such as dae or honk. It names the engine's x-<engine> extension members and routes.
          version:
            type: string
            minLength: 1
      build:
        oneOf:
          - type: "null"
          - type: object
            required: [ revision, target, built_at ]
            properties:
              revision:
                type: [ string, "null" ]
              target:
                type: [ string, "null" ]
              built_at:
                $ref: ./openapi.yaml#/components/schemas/NullableTimestamp
  AvailableResource:
    type: object
    required: [ available ]
    properties:
      available:
        type: boolean
  Capabilities:
    type: object
    required: [ observed_at, profiles, limits, resources ]
    properties:
      observed_at:
        $ref: ./openapi.yaml#/components/schemas/Timestamp
      profiles:
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [ base, full_transparency ]
      limits:
        type: object
        required: [ max_request_target_bytes, max_header_bytes, max_json_body_bytes ]
        properties:
          max_request_target_bytes:
            type: integer
            minimum: 1
          max_header_bytes:
            type: integer
            minimum: 1
          max_json_body_bytes:
            type: integer
            minimum: 1
      resources:
        type: object
        description: Only runtime is required. An absent resource key means the resource is unavailable, exactly as available false does, so a server that predates a resource still validates. Engine-only resources go in an x-<engine> member; other unlisted keys are not allowed.
        required: [ runtime ]
        additionalProperties: false
        patternProperties:
          ^x-[a-z][a-z0-9]*$:
            type: object
            description: The engine's extension resources, keyed by name. Each follows the rules for shared resource keys.
            additionalProperties:
              $ref: ./openapi.yaml#/components/schemas/AvailableResource
        properties:
          config:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ writable, max_bytes, max_sources ]
            not:
              required: [ create, writable ]
              properties:
                create:
                  const: true
                writable:
                  const: false
            properties:
              available:
                type: boolean
                description: Accepted-source readback is implemented. Every returned source carries its content.
              writable:
                type: boolean
                description: |
                  Server-wide switch for replacing accepted sources under control;
                  individual sources may still be read-only. True requires full
                  validation and reload operations, including resources.reload.available
                  and resources.operations.available. Independent of the optional
                  dry-run endpoint.
              create:
                type: boolean
                default: false
                description: |
                  POST /config/sources is implemented: a control caller may add a new
                  source file that an include pattern loads. False by default; true
                  requires writable.
              max_bytes:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Maximum UTF-8 bytes in replacement or new source content. At most limits.max_json_body_bytes minus the request envelope, which is the largest compact UTF-8 JSON encoding of the request body without its content, taking for POST the permitted path whose encoding is longest (each quotation mark or backslash in the path encodes to two bytes, so this exceeds the path's 1024-byte limit). Content that JSON escaping expands can still exceed limits.max_json_body_bytes, and that limit then applies.
              max_sources:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Maximum complete effective source set the engine can expose; never silently truncate it.
          config_validate:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ modes, max_bytes, max_sources ]
            properties:
              available:
                type: boolean
              modes:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  $ref: ./openapi.yaml#/components/schemas/ConfigValidationMode
              max_bytes:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Maximum total UTF-8 configuration source bytes, including locally resolved source text in full mode. Geodata assets do not count toward this limit. The shared JSON body limit applies separately.
              max_sources:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Maximum sources per validation, including local dependencies in full mode.
          runtime:
            $ref: ./openapi.yaml#/components/schemas/AvailableResource
          runtime_memory:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ metrics ]
            properties:
              available:
                type: boolean
              metrics:
                type: array
                uniqueItems: true
                items:
                  type: string
                  enum: [ process.rss_bytes, cgroup.current_bytes, cgroup.limit_bytes, cgroup.events.high, cgroup.events.oom, cgroup.events.oom_kill, kernel.ebpf_bytes ]
          runtime_outbounds:
            $ref: ./openapi.yaml#/components/schemas/AvailableResource
          traffic_history:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ max_window_seconds, max_points ]
            properties:
              available:
                type: boolean
              max_window_seconds:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Maximum look-back window in seconds; not a guarantee against bounded-ring eviction.
              max_points:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Maximum returned samples per history request.
          memory_history:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ max_window_seconds, max_points ]
            properties:
              available:
                type: boolean
              max_window_seconds:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Maximum look-back window in seconds; not a guarantee against bounded-ring eviction.
              max_points:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Maximum returned samples per history request.
          datapath:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ kinds, details ]
            properties:
              available:
                type: boolean
              kinds:
                type: array
                uniqueItems: true
                items:
                  $ref: ./openapi.yaml#/components/schemas/DatapathKind
              details:
                type: array
                uniqueItems: true
                items:
                  type: string
                  enum: [ attachments, maps ]
          nodes:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ can_manage ]
            properties:
              available:
                type: boolean
              can_manage:
                type: boolean
                description: POST /nodes and DELETE /nodes/{node_id} are implemented for inline nodes; the engine owns a writable main source.
          providers:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ can_refresh, can_manage, max_page_size ]
            properties:
              available:
                type: boolean
              can_refresh:
                type: boolean
                description: Refresh is implemented; individual provider kinds may still be unsupported. Requires operations.available.
              can_manage:
                type: boolean
                description: Supports creating subscription providers and deleting subscription or file providers from a writable managed main source.
              create_unfetched:
                type: boolean
                description: A created provider is not fetched until POST /providers/{provider_id}/refresh; it starts with node_count 0, updated_at null and status stale. False or absent means the engine may fetch it during activation and reports its actual state.
              create_options:
                type: object
                additionalProperties: false
                description: Optional ProviderCreate fields the engine accepts, each with the value it applies when the field is omitted. A field not listed is unsupported. Absent means none are supported.
                properties:
                  update_interval:
                    type: integer
                    minimum: 0
                    maximum: 31536000
                  user_agent:
                    type: string
                    minLength: 1
                  cache:
                    type: boolean
              max_page_size:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                maximum: 1000
          groups:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ config_patch, selection, max_patch_operations ]
            properties:
              available:
                type: boolean
              config_patch:
                type: boolean
                description: PATCH /groups/{group_id}/config is implemented. A group patch is a configuration write, so true requires resources.config.writable.
              selection:
                type: boolean
              max_patch_operations:
                type: integer
                minimum: 1
          probes:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ targets, kinds, transports, ip_versions, limits ]
            properties:
              available:
                type: boolean
              targets:
                type: array
                uniqueItems: true
                items:
                  type: string
                  enum: [ node, group ]
              kinds:
                type: array
                uniqueItems: true
                items:
                  $ref: ./openapi.yaml#/components/schemas/ProbeKind
              transports:
                type: array
                uniqueItems: true
                items:
                  $ref: ./openapi.yaml#/components/schemas/Transport
              ip_versions:
                type: array
                uniqueItems: true
                items:
                  $ref: ./openapi.yaml#/components/schemas/IpVersion
              limits:
                $ref: ./openapi.yaml#/components/schemas/ProbeLimits
          connections:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ can_close, max_bulk_close ]
            properties:
              available:
                type: boolean
              can_close:
                type: boolean
                description: Whether userspace-owned connections can be closed; false makes both connection DELETE endpoints return 404 capability_not_supported.
              max_bulk_close:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Maximum matching live entries, including non-closable entries, per bulk close; used only when can_close is true. Excess returns 413 request_too_large before any connection is closed.
          flows:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ recording, scopes, max_flows, max_steps_per_flow, retention_seconds, snapshot_ttl_seconds, max_page_size ]
            properties:
              available:
                type: boolean
              recording:
                type: string
                enum: [ "off", "on", auto, sampled ]
                description: The engine's flow recording policy, not whether the recorder is capturing now. off records none, because the configuration does not permit the flow recorder or its mode is off; on records every flow in scopes (mode on); auto enables recording on client demand; sampled records a subset. recording.flows.active in GET /runtime/settings reports whether capture is active now.
              scopes:
                type: array
                uniqueItems: true
                items:
                  $ref: ./openapi.yaml#/components/schemas/FlowScope
              min_flows:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Smallest flows.max_flows a runtime-settings PATCH may set. Absent means 1.
              max_flows:
                type: integer
                minimum: 1
                description: The largest flow capacity the engine supports, which is the most a runtime-settings PATCH may set, not the current value. The current value is flows.max_flows in GET /runtime/settings.
              max_steps_per_flow:
                type: integer
                minimum: 1
              retention_seconds:
                type: integer
                minimum: 1
                description: The longest terminal-flow retention the engine supports, which is the most a runtime-settings PATCH may set, not the current value. The smallest a PATCH may set is always 1. The current value is flows.retention_seconds in GET /runtime/settings.
              snapshot_ttl_seconds:
                type: integer
                minimum: 1
              max_page_size:
                type: integer
                minimum: 1
                maximum: 1000
          routing_trace:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ resolve_modes, max_addresses, max_rule_steps, timeout_ms, per_principal_requests_per_minute, global_requests_per_minute ]
            properties:
              available:
                type: boolean
              resolve_modes:
                type: array
                uniqueItems: true
                items:
                  type: string
                  enum: [ none, live ]
              max_addresses:
                type: integer
                minimum: 1
              max_rule_steps:
                type: integer
                minimum: 1
              timeout_ms:
                type: integer
                minimum: 1
              per_principal_requests_per_minute:
                type: integer
                minimum: 1
              global_requests_per_minute:
                type: integer
                minimum: 1
          rules:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ max_rules ]
            properties:
              available:
                type: boolean
              max_rules:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Maximum complete rule dictionary size, including the fallback entry; never below the running generation's size and never a truncation limit.
          events:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ kinds, retention_seconds, max_buffered_events, max_clients, heartbeat_seconds ]
            properties:
              available:
                type: boolean
              kinds:
                type: array
                uniqueItems: true
                items:
                  $ref: ./openapi.yaml#/components/schemas/EventKind
              retention_seconds:
                type: integer
                minimum: 0
              max_buffered_events:
                type: integer
                minimum: 1
              max_clients:
                type: integer
                minimum: 1
              heartbeat_seconds:
                type: integer
                minimum: 1
                maximum: 15
          logs:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ levels, filters, retention_seconds, max_buffered_records ]
            properties:
              available:
                type: boolean
              levels:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  $ref: ./openapi.yaml#/components/schemas/LogLevel
              filters:
                type: array
                uniqueItems: true
                description: The GET /logs query filters this engine applies. level is always listed; a filter not listed returns 422 unsupported_value.
                items:
                  type: string
                  enum: [ level, target ]
                contains:
                  const: level
              retention_seconds:
                type: integer
                minimum: 1
                description: Maximum age of a replayable record, in seconds. A resume cursor older than this returns 409 event_cursor_expired even when the ring has room.
              min_buffered_records:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Smallest log.buffered_records a runtime-settings PATCH may set. Absent means 1.
              max_buffered_records:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Maximum permitted log replay-ring capacity. The current capacity is runtime settings log.buffered_records. Neither value guarantees retention duration.
          dns_query:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ record_types, limits ]
            properties:
              available:
                type: boolean
              record_types:
                type: array
                uniqueItems: true
                items:
                  $ref: ./openapi.yaml#/components/schemas/DnsRecordType
              limits:
                $ref: ./openapi.yaml#/components/schemas/DnsQueryLimits
          dns_cache:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ read, delete_entry, delete_name, flush, entry_kinds ]
            properties:
              available:
                type: boolean
              read:
                type: boolean
              delete_entry:
                type: boolean
              delete_name:
                type: boolean
              flush:
                type: boolean
              entry_kinds:
                type: array
                uniqueItems: true
                items:
                  type: string
                  enum: [ positive, negative ]
          dns_log:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ max_records, max_page_size ]
            properties:
              available:
                type: boolean
              min_records:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Smallest dns_log.max_records a runtime-settings PATCH may set. Absent means 1.
              max_records:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Maximum permitted DNS log-ring capacity. The current capacity is dns_log.max_records in GET /runtime/settings. Neither value guarantees retention duration.
              max_page_size:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
          dns_rules:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ max_rules ]
            properties:
              available:
                type: boolean
              max_rules:
                $ref: ./openapi.yaml#/components/schemas/SafeUInt
                minimum: 1
                description: Maximum size of each DNS rule list, including its fallback entry; never below either running list's size and never a truncation limit.
          runtime_settings:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ fields ]
            properties:
              available:
                type: boolean
              fields:
                type: array
                uniqueItems: true
                description: The settings PATCH /runtime/settings accepts on this engine; another field the schema defines returns 422.
                items:
                  $ref: ./openapi.yaml#/components/schemas/RuntimeSettingField
          geodata:
            type: object
            required: [ available ]
            allOf:
              - if:
                  properties:
                    available:
                      const: true
                then:
                  required: [ can_update, assets ]
              - if:
                  required: [ can_update ]
                  properties:
                    can_update:
                      const: true
                then:
                  required: [ checksum ]
              - if:
                  required: [ configurable_sources ]
                  properties:
                    configurable_sources:
                      const: true
                then:
                  required: [ max_urls, interval_hours, checksum, lifecycle ]
            properties:
              available:
                type: boolean
              can_update:
                type: boolean
                description: POST /geodata/update is implemented. Requires operations.available and configured asset sources.
              assets:
                type: array
                uniqueItems: true
                description: The asset kinds GET /geodata reports on this engine.
                items:
                  $ref: ./openapi.yaml#/components/schemas/GeoAssetKind
              configurable_sources:
                type: boolean
                description: Download URLs and automatic updates are managed through geodata in GET and PATCH /runtime/settings, and GET /geodata reports update status and required_codes. Requires runtime_settings.available with geodata in its fields. Absent means false.
              max_urls:
                type: integer
                minimum: 1
                description: Most download URLs per asset a geodata patch may set. Required when configurable_sources is true.
              interval_hours:
                type: object
                additionalProperties: false
                required: [ min, max, default ]
                description: Bounds of geodata auto_update.interval_hours, and the nominal value it reads under a cron schedule. Required when configurable_sources is true. min <= default <= max is required; JSON Schema cannot express this ordering, so validators check it separately.
                properties:
                  min:
                    type: integer
                    minimum: 1
                  max:
                    type: integer
                    minimum: 1
                  default:
                    type: integer
                    minimum: 1
              checksum:
                type: [ string, "null" ]
                enum: [ sha256sum, pinned, null ]
                description: How the engine verifies a download when verify_checksum is true. sha256sum appends .sha256sum to the URL path, keeping any query, and compares the SHA-256 the response names; a 404 means none is published. pinned compares with a SHA-256 the engine holds for the URL. Null means downloads are unverified. Required when can_update or configurable_sources is true.
              lifecycle:
                type: object
                additionalProperties: false
                required: [ file_values, overrides_persist ]
                description: When geodata settings take configuration-file values and how long overrides last; see Geodata. Required when configurable_sources is true.
                properties:
                  file_values:
                    type: string
                    enum: [ start, activation ]
                    description: start takes file values at process start only; activation also takes them at each configuration activation.
                  overrides_persist:
                    type: boolean
                    description: True when a PATCH override lasts across restarts; false when it lasts until the process exits.
          operations:
            type: object
            required: [ available ]
            if:
              properties:
                available:
                  const: true
            then:
              required: [ retention_seconds ]
            properties:
              available:
                type: boolean
              retention_seconds:
                type: integer
                minimum: 0
              max_replay_keys:
                type: integer
                minimum: 1
                description: Finished Idempotency-Key records the server keeps before the retention window ends. Beyond this count it may evict the oldest-finished first. Absent means none are evicted before the window ends. Keys of unfinished operations are never evicted.
          reload:
            $ref: ./openapi.yaml#/components/schemas/AvailableResource
          suspend:
            $ref: ./openapi.yaml#/components/schemas/AvailableResource
          resume:
            $ref: ./openapi.yaml#/components/schemas/AvailableResource
