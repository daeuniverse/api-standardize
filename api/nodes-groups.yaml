paths:
  /api/v1/nodes:
    get:
      operationId: listNodes
      tags: [ Nodes ]
      summary: List nodes and latest typed health samples
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: group_id
          in: query
          schema:
            type: string
            minLength: 1
          example: group-proxy
        - $ref: ./openapi.yaml#/components/parameters/Limit1000
        - $ref: ./openapi.yaml#/components/parameters/Cursor
      responses:
        "200":
          description: Node page
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/NodeList
              examples:
                nodes:
                  value:
                    observed_at: 2026-08-15T10:00:00Z
                    nodes:
                      - id: node-hk-01
                        name: hk-01
                        protocol: vless
                        stream_transport: xhttp
                        subscription_tag: provider-a
                        provider_id: provider-a
                        group_ids: [ group-proxy ]
                        health:
                          - transport: tcp
                            purpose: shared
                            ip_version: ipv4
                            warmth: cold
                            measurement: http_round_trip
                            sample_source: probe
                            state: healthy
                            latency_ms: 45
                            moving_avg_ms: 47.5
                            avg10_ms: null
                            observed_at: 2026-08-15T10:00:00Z
                            error: null
                    next_cursor: null
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "410":
          $ref: ./openapi.yaml#/components/responses/SnapshotExpired
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
        "503":
          $ref: ./openapi.yaml#/components/responses/SnapshotUnavailable
    post:
      operationId: createNode
      tags: [ Nodes ]
      summary: Add an inline node from a share link
      description: |
        Requires resources.nodes.can_manage; otherwise returns 404
        capability_not_supported. The engine parses the link with its own
        share-link support, writes it into the node section of its managed main
        source under the given name, advances the configuration revision and emits
        generation.changed. The response does not echo the link; the source text
        returns it as written (see Visibility in API Configuration). A link the engine
        cannot parse returns 422 unsupported_value with a sanitized reason in
        error.message. A name already in use, or a configuration change while the
        create is being admitted, returns 409 state_conflict. The node belongs to the
        inline provider and to every group whose filter matches it after reload.
        Returns 201 with the node once the change is active, or 202 with a
        node_create operation whose result is the created node. A failed
        activation reports its outcome as defined under activation outcomes in
        the error contract.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./openapi.yaml#/components/schemas/NodeCreate
            examples:
              link:
                value:
                  name: hk-03
                  link: vless://uuid@example.com:443?security=tls#hk-03
      responses:
        "202":
          description: Node creation accepted as a node_create operation
          headers:
            Location:
              description: Operation status URL; equal to body href.
              required: true
              schema:
                type: string
                pattern: ^/api/v1/operations/[^/]+$
            Retry-After:
              description: Positive polling floor in seconds.
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/OperationAccepted
              examples:
                queued:
                  value:
                    operation_id: op-01HZX4K8WB
                    kind: node_create
                    status: queued
                    href: /api/v1/operations/op-01HZX4K8WB
                  x-headers:
                    Content-Type: application/json
                    Location: /api/v1/operations/op-01HZX4K8WB
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "201":
          description: Node written to the managed configuration and active
          headers:
            Location:
              description: The new node, readable with GET.
              required: true
              schema:
                type: string
                pattern: ^/api/v1/nodes/[^/]+$
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Node
              examples:
                created:
                  value:
                    id: node-hk-03
                    name: hk-03
                    protocol: vless
                    subscription_tag: null
                    provider_id: inline
                    group_ids: [ group-proxy ]
                    health: []
                  x-headers:
                    Content-Type: application/json
                    Location: /api/v1/nodes/node-hk-03
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "409":
          description: A node with this name exists, or the configuration changed while the create was being admitted (state_conflict)
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                name_taken:
                  value:
                    error:
                      code: state_conflict
                      message: An inline node named hk-03 already exists.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "413":
          description: Request body exceeds limits.max_json_body_bytes
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                too_large:
                  value:
                    error:
                      code: request_too_large
                      message: The request body exceeds the advertised limit.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "415":
          description: Request body is not application/json
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                unsupported:
                  value:
                    error:
                      code: unsupported_media_type
                      message: The request body must be application/json.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "422":
          description: The engine cannot parse the link
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                bad_link:
                  value:
                    error:
                      code: unsupported_value
                      message: Unsupported share link scheme "foo".
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
  /api/v1/nodes/{node_id}:
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/NodeId
    get:
      operationId: getNode
      tags: [ Nodes ]
      summary: Read one node and its latest typed health samples
      description: |
        Returns the same projection as one entry of GET /api/v1/nodes. An unknown id
        returns 404 resource_not_found.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: One node
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Node
              examples:
                node:
                  value:
                    id: node-hk-03
                    name: hk-03
                    protocol: vless
                    subscription_tag: null
                    provider_id: inline
                    group_ids: [ group-proxy ]
                    health: []
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
    delete:
      operationId: deleteNode
      tags: [ Nodes ]
      summary: Remove an inline node from the managed configuration
      description: |
        Requires resources.nodes.can_manage; otherwise returns 404
        capability_not_supported, as does a node that came from a subscription or
        file provider: those are removed by refreshing or deleting their provider.
        Removes the node's line from the node section of the managed main source and
        the node from the running groups, advances the configuration revision and
        emits generation.changed. Idempotent: an unknown id returns deleted 0.
        Returns 200 once the change is active, or 202 with a node_delete
        operation whose result is the same deletion count. A failed
        activation reports its outcome as defined under activation outcomes in
        the error contract.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      responses:
        "202":
          description: Node deletion accepted as a node_delete operation
          headers:
            Location:
              description: Operation status URL; equal to body href.
              required: true
              schema:
                type: string
                pattern: ^/api/v1/operations/[^/]+$
            Retry-After:
              description: Positive polling floor in seconds.
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/OperationAccepted
              examples:
                queued:
                  value:
                    operation_id: op-01HZX4K8WC
                    kind: node_delete
                    status: queued
                    href: /api/v1/operations/op-01HZX4K8WC
                  x-headers:
                    Content-Type: application/json
                    Location: /api/v1/operations/op-01HZX4K8WC
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "200":
          description: Idempotent deletion result
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/DeleteCount
              examples:
                deleted:
                  value:
                    deleted: 1
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "409":
          $ref: ./openapi.yaml#/components/responses/Conflict
          description: A group or the routing final outbound still names the node, or the configuration changed while the delete was being admitted (state_conflict); nothing is removed. Filter-matched membership is not a reference. After a concurrent change, read the node back and retry.
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
  /api/v1/groups:
    get:
      operationId: listGroups
      tags: [ Groups ]
      summary: List group summaries
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Group summaries
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/GroupList
              examples:
                groups:
                  value:
                    - id: group-proxy
                      name: proxy
                      icon: https://icons.example/proxy.png
                      config_revision: "17"
                      policy:
                        kind: urltest
                        native: urltest
                      member_count: 2
                      selection:
                        tcp_member_id: node-hk-01
                        udp_member_id: null
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
  /api/v1/groups/{group_id}:
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/GroupId
    get:
      operationId: getGroup
      tags: [ Groups ]
      summary: Read a complete group resource
      description: |
        Returns the group with its configuration, runtime selection and health.
        The response has no ETag: selection and health change without a
        configuration change. Conditional writes use GET /groups/{group_id}/config.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Current group
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Group
              examples:
                current:
                  value:
                    id: group-proxy
                    name: proxy
                    icon: https://icons.example/proxy.png
                    config_revision: "17"
                    policy:
                      kind: urltest
                      native: urltest
                    members:
                      - id: node-hk-01
                        name: hk-01
                        kind: node
                      - id: group-jp
                        name: jp
                        kind: group
                    config:
                      default_member_id: null
                      final_outbound: direct
                      check_url: null
                      check_interval: 30
                      tolerance: 50
                      idle_timeout: null
                      interrupt_connections: false
                    runtime:
                      selection:
                        tcp:
                          member_id: node-hk-01
                          resolved_leaf_node_id: node-hk-01
                          source: health
                        udp: null
                      health:
                        - member_id: node-hk-01
                          resolved_leaf_node_id: node-hk-01
                          transport: tcp
                          purpose: shared
                          ip_version: ipv4
                          warmth: unknown
                          measurement: http_round_trip
                          sample_source: probe
                          state: healthy
                          latency_ms: 45
                          moving_avg_ms: 47.5
                          avg10_ms: null
                          sorting_latency_ms: 72.5
                          ranking:
                            metric: moving_avg_ms
                            recovery_penalty_ms: 10
                            group_offset_ms: 15
                            score: null
                            reason: minimum_with_hysteresis
                          observed_at: 2026-08-15T10:00:00Z
                          error: null
                    capabilities:
                      can_select: false
                      can_override: true
                      supports_nested_groups: true
                      mutable_config: [ policy, default_member_id, final_outbound, check_url, check_interval, tolerance, idle_timeout, interrupt_connections ]
                      probe_transports: [ tcp, udp ]
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
  /api/v1/groups/{group_id}/config:
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/GroupId
    get:
      operationId: getGroupConfig
      tags: [ Groups ]
      summary: Read the group's policy and configured options
      description: |
        Returns the group's policy and config, the same values GET
        /groups/{group_id} embeds, as the target document of PATCH. The ETag is
        the configuration-wide revision in double quotes; it changes only with
        an accepted configuration change.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Current group configuration
          headers:
            ETag:
              $ref: ./openapi.yaml#/components/headers/ETag
              description: The configuration-wide revision in double quotes, the value PATCH compares in If-Match.
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/GroupConfigDocument
              examples:
                current:
                  value:
                    policy:
                      kind: urltest
                      native: urltest
                    config:
                      default_member_id: null
                      final_outbound: direct
                      check_url: null
                      check_interval: 30
                      tolerance: 50
                      idle_timeout: null
                      interrupt_connections: false
                  x-headers:
                    Content-Type: application/json
                    ETag: '"17"'
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
    patch:
      operationId: patchGroupConfig
      tags: [ Groups ]
      summary: Patch mutable group configuration
      description: |
        RFC 6902 JSON Patch whose target document is GroupConfigDocument, the
        body GET /groups/{group_id}/config returns. Operations apply in order to
        that document; see groups, Patch semantics, for remove, null, copy, move and test.
        Only fields in capabilities.mutable_config may change, judged by the
        effective write against the policy after the patch: one patch may set
        policy to urltest and add tolerance. When the resulting policy is not
        URLTest, a tolerance left non-null and changed returns 422 unsupported_value.
        A change to a field absent from mutable_config, such as
        interrupt_connections on an engine without that option, returns 422
        unsupported_value. Requires resources.groups.config_patch. If-Match carries the
        configuration-wide revision from the ETag of GET; see
        [Groups](/v0.1.0/en/docs/groups.html) for 412 and 409.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/IfMatchOptional
        - $ref: ./openapi.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              $ref: ./openapi.yaml#/components/schemas/JsonPatch
            examples:
              tolerance:
                value:
                  - op: replace
                    path: /config/tolerance
                    value: 100
                  - op: replace
                    path: /config/interrupt_connections
                    value: true
                x-headers:
                  Content-Type: application/json-patch+json
                  If-Match: '"17"'
      responses:
        "200":
          description: Updated group configuration
          headers:
            ETag:
              $ref: ./openapi.yaml#/components/headers/ETag
              description: The new configuration revision in double quotes.
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/GroupConfigDocument
        "202":
          description: Operation accepted
          headers:
            Location:
              description: Operation status URL; equal to body href.
              required: true
              schema:
                type: string
                pattern: ^/api/v1/operations/[^/]+$
            Retry-After:
              description: Positive polling floor in seconds.
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/OperationAccepted
              examples:
                queued:
                  value:
                    operation_id: op-01HZX4K8WA
                    kind: group_update
                    status: queued
                    href: /api/v1/operations/op-01HZX4K8WA
                  x-headers:
                    Content-Type: application/json
                    Location: /api/v1/operations/op-01HZX4K8WA
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "409":
          $ref: ./openapi.yaml#/components/responses/Conflict
        "412":
          description: If-Match does not match the current configuration revision, on arrival or at commit
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                stale_revision:
                  value:
                    error:
                      code: stale_revision
                      message: The resource changed; fetch it again before retrying.
                      details:
                        field: null
                    request_id: request-01HZX4K8W5
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
        "415":
          $ref: ./openapi.yaml#/components/responses/UnsupportedMediaType
        "422":
          $ref: ./openapi.yaml#/components/responses/Unprocessable
        "428":
          $ref: ./openapi.yaml#/components/responses/PreconditionRequired
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
          description: The change could not be queued (temporarily_unavailable); nothing is written. Retry after Retry-After.
  /api/v1/groups/{group_id}/selection:
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/GroupId
    put:
      operationId: selectGroupMember
      tags: [ Groups ]
      summary: Replace a selector's choice, or pin a member on an automatic group
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./openapi.yaml#/components/schemas/GroupSelectionRequest
            examples:
              tcp_udp:
                value:
                  member_id: node-hk-01
                  network: both
      responses:
        "200":
          description: Applied runtime selection
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/GroupSelectionResult
              examples:
                selected:
                  value:
                    group_id: group-proxy
                    member_id: node-hk-01
                    resolved_leaf_node_id: node-hk-01
                    network: both
                    source: runtime
                    selection_revision: "8"
                    connections_interrupted: false
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "409":
          $ref: ./openapi.yaml#/components/responses/Conflict
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
        "415":
          $ref: ./openapi.yaml#/components/responses/UnsupportedMediaType
        "422":
          $ref: ./openapi.yaml#/components/responses/Unprocessable
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
          description: The runtime control owner is unavailable or did not confirm the transition (temporarily_unavailable). The selection may have changed; read the group back before retrying after Retry-After.
    delete:
      operationId: clearGroupOverride
      tags: [ Groups ]
      summary: Clear a pinned member so the automatic policy chooses again
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: network
          in: query
          required: false
          schema:
            type: string
            enum: [ tcp, udp, both ]
            default: both
      responses:
        "200":
          description: |
            Selections after clearing the requested overrides. A network without
            a selected member is null. If no override existed, its selection is
            unchanged.
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/GroupOverrideCleared
              examples:
                automatic_again:
                  value:
                    group_id: group-auto
                    network: both
                    selection_revision: "9"
                    connections_interrupted: false
                    selection:
                      tcp:
                        member_id: node-sg-01
                        resolved_leaf_node_id: node-sg-01
                        source: policy
                      udp: null
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "409":
          $ref: ./openapi.yaml#/components/responses/Conflict
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
          description: The runtime control owner is unavailable or did not confirm the transition (temporarily_unavailable). The override may have been cleared; read the group back before retrying after Retry-After.
schemas:
  HealthObservation:
    type: object
    required: [ transport, purpose, ip_version, warmth, measurement, sample_source, state, latency_ms, moving_avg_ms, avg10_ms, observed_at, error ]
    properties:
      transport:
        $ref: ./openapi.yaml#/components/schemas/Transport
      purpose:
        type: string
        enum: [ data, dns, shared ]
      ip_version:
        $ref: ./openapi.yaml#/components/schemas/IpVersion
      warmth:
        type: string
        enum: [ cold, warm, mixed, unknown ]
      measurement:
        type: string
        enum: [ tcp_connect, http_headers, http_round_trip, dns_round_trip, quic_handshake, mixed, unknown ]
      sample_source:
        type: string
        enum: [ probe, traffic, restored, derived, mixed, unknown ]
      state:
        type: string
        enum: [ healthy, unavailable, unknown ]
      latency_ms:
        type: [ number, "null" ]
        minimum: 0
      moving_avg_ms:
        type: [ number, "null" ]
        minimum: 0
      avg10_ms:
        type: [ number, "null" ]
        minimum: 0
      observed_at:
        $ref: ./openapi.yaml#/components/schemas/Timestamp
      error:
        type: [ string, "null" ]
    allOf:
      - if:
          properties:
            state:
              enum: [ unavailable, unknown ]
        then:
          properties:
            latency_ms:
              type: "null"
  Node:
    type: object
    required: [ id, name, protocol, subscription_tag, group_ids, health ]
    properties:
      id:
        type: string
        minLength: 1
      name:
        type: string
        minLength: 1
      protocol:
        type: [ string, "null" ]
      stream_transport:
        type: [ string, "null" ]
        description: Configured stream transport, not the negotiated transport or TCP/UDP health. Omitted or null when unavailable or inapplicable; future string values are allowed.
        examples: [ tcp, ws, grpc, xhttp ]
      subscription_tag:
        type: [ string, "null" ]
      provider_id:
        type: [ string, "null" ]
        minLength: 1
        description: Provider identity from GET /providers; omitted or null when provenance is unavailable. Never infer it from the node name.
      group_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      health:
        type: array
        description: Latest observations, unique by (transport, purpose, measurement, ip_version, warmth) within this node.
        items:
          $ref: ./openapi.yaml#/components/schemas/HealthObservation
  NodeCreateSucceededOperation:
    allOf:
      - $ref: ./openapi.yaml#/components/schemas/OperationCommon
      - type: object
        properties:
          kind:
            const: node_create
          status:
            const: succeeded
          finished_at:
            $ref: ./openapi.yaml#/components/schemas/Timestamp
          result:
            $ref: ./openapi.yaml#/components/schemas/Node
          error:
            type: "null"
  NodeDeleteSucceededOperation:
    allOf:
      - $ref: ./openapi.yaml#/components/schemas/OperationCommon
      - type: object
        properties:
          kind:
            const: node_delete
          status:
            const: succeeded
          finished_at:
            $ref: ./openapi.yaml#/components/schemas/Timestamp
          result:
            $ref: ./openapi.yaml#/components/schemas/DeleteCount
          error:
            type: "null"
  NodeCreate:
    type: object
    additionalProperties: false
    required: [ name, link ]
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 64
        description: The node name as written in the configuration; unique among inline nodes.
      link:
        type: string
        minLength: 1
        maxLength: 8192
        description: A share link in a scheme the engine parses (for example vless, vmess, trojan, ss); stored in the managed main source, whose text returns it as written.
  NodeList:
    type: object
    required: [ observed_at, nodes, next_cursor ]
    properties:
      observed_at:
        $ref: ./openapi.yaml#/components/schemas/Timestamp
      nodes:
        type: array
        items:
          $ref: ./openapi.yaml#/components/schemas/Node
      next_cursor:
        type: [ string, "null" ]
  GroupPolicy:
    type: object
    required: [ kind, native ]
    properties:
      kind:
        type: string
        enum: [ selector, urltest, loadbalance, fallback, random, score, fixed ]
      native:
        type: string
        minLength: 1
  GroupPolicyRequest:
    type: object
    additionalProperties: false
    required: [ kind, native ]
    properties:
      kind:
        type: string
        enum: [ selector, urltest, loadbalance, fallback, random, score, fixed ]
      native:
        type: string
        minLength: 1
  GroupMember:
    type: object
    required: [ id, name, kind ]
    properties:
      id:
        type: string
        minLength: 1
      name:
        type: string
        minLength: 1
      kind:
        type: string
        enum: [ node, group ]
  GroupConfig:
    type: object
    description: The group's own configured options, patched through PATCH /groups/{group_id}/config. For an option the engine supports, null means the group sets no value of its own and the engine's inheritance and defaults apply. Engine-only options go in a nested x-<engine> member, for example config["x-dae"].check_addresses; GET reports these members and they are not patch targets. Other unlisted keys are not allowed.
    required: [ default_member_id, final_outbound, check_url, check_interval, tolerance, idle_timeout, interrupt_connections ]
    additionalProperties: false
    patternProperties:
      ^x-[a-z][a-z0-9]*$:
        type: object
        description: The engine's own group options, keyed by name. GET reports them; PATCH does not address them.
    properties:
      default_member_id:
        type: [ string, "null" ]
      final_outbound:
        type: [ string, "null" ]
      check_url:
        description: The one health-check URL. Engines probe this URL only; there is no list of URLs.
        oneOf:
          - type: "null"
          - $ref: ./openapi.yaml#/components/schemas/SafeHttpUrl
      check_interval:
        type: [ integer, "null" ]
        minimum: 1
        description: Configured health-check interval in seconds. An engine that runs checks on one global interval may keep this value without applying it.
      tolerance:
        type: [ integer, "null" ]
        minimum: 0
        description: Minimum latency improvement in milliseconds before a URLTest group switches members.
      idle_timeout:
        type: [ integer, "null" ]
        minimum: 0
        description: Inactivity in seconds after which a URLTest group counts as idle.
      interrupt_connections:
        type: [ boolean, "null" ]
        description: Whether changing the selection closes connections through the previous member. Null means the group sets no value of its own, or the engine has no such option.
  GroupConfigDocument:
    type: object
    description: The group's policy and configured options, the target document of PATCH /groups/{group_id}/config.
    required: [ policy, config ]
    properties:
      policy:
        $ref: ./openapi.yaml#/components/schemas/GroupPolicy
      config:
        $ref: ./openapi.yaml#/components/schemas/GroupConfig
  SafeHttpUrl:
    type: string
    format: uri
    pattern: ^https?://(?![^/?#]*@)
    description: Absolute HTTP(S) URL without userinfo, checked under the outbound-request policy in api-config.
  GroupSelection:
    type: object
    required: [ member_id, source ]
    properties:
      member_id:
        type: string
        minLength: 1
      resolved_leaf_node_id:
        type: [ string, "null" ]
      source:
        type: string
        minLength: 1
        description: How the member was chosen. `override` while a pinned member stands in for an automatic policy; other values (health, runtime, policy, ...) are the engine's own.
  GroupRanking:
    type: object
    required: [ metric, recovery_penalty_ms, group_offset_ms, score, reason ]
    properties:
      metric:
        type: [ string, "null" ]
      recovery_penalty_ms:
        type: [ number, "null" ]
      group_offset_ms:
        type: [ number, "null" ]
      score:
        type: [ number, "null" ]
      reason:
        type: [ string, "null" ]
  GroupHealthObservation:
    allOf:
      - $ref: ./openapi.yaml#/components/schemas/HealthObservation
      - type: object
        required: [ member_id, sorting_latency_ms, ranking ]
        properties:
          member_id:
            type: string
            minLength: 1
          resolved_leaf_node_id:
            type: [ string, "null" ]
          sorting_latency_ms:
            type: [ number, "null" ]
          ranking:
            oneOf:
              - type: "null"
              - $ref: ./openapi.yaml#/components/schemas/GroupRanking
  GroupRuntime:
    type: object
    required: [ selection, health ]
    properties:
      selection:
        type: object
        required: [ tcp, udp ]
        properties:
          tcp:
            oneOf:
              - type: "null"
              - $ref: ./openapi.yaml#/components/schemas/GroupSelection
          udp:
            oneOf:
              - type: "null"
              - $ref: ./openapi.yaml#/components/schemas/GroupSelection
      health:
        type: array
        items:
          $ref: ./openapi.yaml#/components/schemas/GroupHealthObservation
  GroupCapabilities:
    type: object
    required: [ can_select, can_override, supports_nested_groups, mutable_config, probe_transports ]
    properties:
      can_select:
        type: boolean
        description: The policy is a manual selector; PUT selection replaces its choice.
      can_override:
        type: boolean
        description: The policy chooses automatically but accepts a pinned member; PUT selection pins, DELETE selection returns to automatic.
      supports_nested_groups:
        type: boolean
      mutable_config:
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [ policy, default_member_id, final_outbound, check_url, check_interval, tolerance, idle_timeout, interrupt_connections ]
      probe_transports:
        type: array
        uniqueItems: true
        items:
          $ref: ./openapi.yaml#/components/schemas/Transport
  Group:
    type: object
    required: [ id, name, icon, config_revision, policy, members, config, runtime, capabilities ]
    properties:
      id:
        type: string
        minLength: 1
      name:
        type: string
        minLength: 1
      icon:
        type: [ string, "null" ]
        maxLength: 2048
        description: Configured group icon as an absolute HTTP(S) URL or data URI; null when no icon is configured.
      config_revision:
        type: string
        minLength: 1
      policy:
        $ref: ./openapi.yaml#/components/schemas/GroupPolicy
      members:
        type: array
        items:
          $ref: ./openapi.yaml#/components/schemas/GroupMember
      config:
        $ref: ./openapi.yaml#/components/schemas/GroupConfig
      runtime:
        $ref: ./openapi.yaml#/components/schemas/GroupRuntime
      capabilities:
        $ref: ./openapi.yaml#/components/schemas/GroupCapabilities
  GroupSummary:
    type: object
    required: [ id, name, icon, config_revision, policy, member_count, selection ]
    properties:
      id:
        type: string
        minLength: 1
      name:
        type: string
        minLength: 1
      icon:
        type: [ string, "null" ]
        maxLength: 2048
        description: Configured group icon as an absolute HTTP(S) URL or data URI; null when no icon is configured.
      config_revision:
        type: string
        minLength: 1
        description: Same opaque configuration revision as Group.config_revision; preserve without numeric parsing.
      policy:
        $ref: ./openapi.yaml#/components/schemas/GroupPolicy
      member_count:
        type: integer
        minimum: 0
      selection:
        type: object
        required: [ tcp_member_id, udp_member_id ]
        properties:
          tcp_member_id:
            type: [ string, "null" ]
          udp_member_id:
            type: [ string, "null" ]
  GroupList:
    type: array
    items:
      $ref: ./openapi.yaml#/components/schemas/GroupSummary
  JsonPatch:
    type: array
    minItems: 1
    items:
      oneOf:
        - $ref: ./openapi.yaml#/components/schemas/PolicyPatch
        - $ref: ./openapi.yaml#/components/schemas/MemberIdPatch
        - $ref: ./openapi.yaml#/components/schemas/OutboundPatch
        - $ref: ./openapi.yaml#/components/schemas/CheckUrlPatch
        - $ref: ./openapi.yaml#/components/schemas/PositiveIntegerPatch
        - $ref: ./openapi.yaml#/components/schemas/TolerancePatch
        - $ref: ./openapi.yaml#/components/schemas/IdleTimeoutPatch
        - $ref: ./openapi.yaml#/components/schemas/InterruptPatch
        - $ref: ./openapi.yaml#/components/schemas/RemovePatch
        - $ref: ./openapi.yaml#/components/schemas/CopyMovePatch
    description: RFC 6902 operations over the group's policy and config, applied in order. Bounded by resources.groups.max_patch_operations. Members an operation object does not define are ignored (RFC 6902 §4).
  PolicyPatch:
    type: object
    required: [ op, path, value ]
    properties:
      op:
        type: string
        enum: [ add, replace, test ]
      path:
        type: string
        const: /policy
      value:
        $ref: "./openapi.yaml#/components/schemas/GroupPolicyRequest"
  MemberIdPatch:
    type: object
    required: [ op, path, value ]
    properties:
      op:
        type: string
        enum: [ add, replace, test ]
      path:
        type: string
        const: /config/default_member_id
      value:
        type: [ string, "null" ]
  OutboundPatch:
    type: object
    required: [ op, path, value ]
    properties:
      op:
        type: string
        enum: [ add, replace, test ]
      path:
        type: string
        const: /config/final_outbound
      value:
        type: [ string, "null" ]
  CheckUrlPatch:
    type: object
    required: [ op, path, value ]
    properties:
      op:
        type: string
        enum: [ add, replace, test ]
      path:
        type: string
        const: /config/check_url
      value:
        oneOf:
          - type: "null"
          - $ref: "./openapi.yaml#/components/schemas/SafeHttpUrl"
  PositiveIntegerPatch:
    type: object
    required: [ op, path, value ]
    properties:
      op:
        type: string
        enum: [ add, replace, test ]
      path:
        type: string
        enum: [ /config/check_interval ]
      value:
        type: [ integer, "null" ]
        minimum: 1
  TolerancePatch:
    type: object
    required: [ op, path, value ]
    properties:
      op:
        type: string
        enum: [ add, replace, test ]
      path:
        type: string
        const: /config/tolerance
      value:
        type: [ integer, "null" ]
        minimum: 0
  IdleTimeoutPatch:
    type: object
    required: [ op, path, value ]
    properties:
      op:
        type: string
        enum: [ add, replace, test ]
      path:
        type: string
        const: /config/idle_timeout
      value:
        type: [ integer, "null" ]
        minimum: 0
  InterruptPatch:
    type: object
    required: [ op, path, value ]
    properties:
      op:
        type: string
        enum: [ add, replace, test ]
      path:
        type: string
        const: /config/interrupt_connections
      value:
        type: [ boolean, "null" ]
  MutableGroupPath:
    type: string
    enum: [ /policy, /config/default_member_id, /config/final_outbound, /config/check_url, /config/check_interval, /config/tolerance, /config/idle_timeout, /config/interrupt_connections ]
  RemovePatch:
    type: object
    required: [ op, path ]
    properties:
      op:
        const: remove
      path:
        $ref: ./openapi.yaml#/components/schemas/MutableGroupPath
  CopyMovePatch:
    type: object
    required: [ op, path, from ]
    properties:
      op:
        enum: [ copy, move ]
      path:
        $ref: ./openapi.yaml#/components/schemas/MutableGroupPath
      from:
        $ref: ./openapi.yaml#/components/schemas/MutableGroupPath
  GroupSelectionRequest:
    type: object
    additionalProperties: false
    required: [ member_id, network ]
    properties:
      member_id:
        type: string
        minLength: 1
      network:
        type: string
        enum: [ tcp, udp, both ]
  GroupOverrideCleared:
    type: object
    description: The outcome of clearing an override, one selection per network like GroupRuntime.selection.
    required: [ group_id, network, selection_revision, connections_interrupted, selection ]
    properties:
      group_id:
        type: string
        minLength: 1
      network:
        type: string
        enum: [ tcp, udp, both ]
        description: The networks the request cleared.
      selection_revision:
        type: string
        minLength: 1
      connections_interrupted:
        type: boolean
      selection:
        type: object
        required: [ tcp, udp ]
        properties:
          tcp:
            oneOf:
              - type: "null"
              - $ref: ./openapi.yaml#/components/schemas/GroupSelection
          udp:
            oneOf:
              - type: "null"
              - $ref: ./openapi.yaml#/components/schemas/GroupSelection
  GroupSelectionResult:
    type: object
    required: [ group_id, member_id, network, source, selection_revision, connections_interrupted ]
    properties:
      group_id:
        type: string
        minLength: 1
      member_id:
        type: string
        minLength: 1
      resolved_leaf_node_id:
        type: [ string, "null" ]
      network:
        type: string
        enum: [ tcp, udp, both ]
      source:
        type: string
        enum: [ runtime, override ]
        description: runtime for a manual selector; override for a pinned member on an automatic policy.
      selection_revision:
        type: string
        minLength: 1
      connections_interrupted:
        type: boolean
