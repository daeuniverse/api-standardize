paths:
  /api/v1/runtime/settings:
    get:
      operationId: getRuntimeSettings
      tags: [ "Runtime settings" ]
      summary: Read the runtime-adjustable settings
      description: |
        Requires resources.runtime_settings.available. Returns the current
        runtime-adjustable settings. Only observed_at and source are always present:
        a value appears when resources.runtime_settings.fields lists it, and
        recording.flows, recording.logs and recording.dns_log appear when
        record_flows, record_logs and record_dns_log are listed. An engine may
        report other values it cannot change. Numeric values stay inside their
        capability bounds. source is config when values come from the activated
        configuration and runtime after a runtime override. geodata appears when
        resources.geodata.configurable_sources is true and carries its own source.
        Its URLs are returned as written, with only listener-secret values masked,
        to every admitted caller; see the visibility table in api-config.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Current runtime settings
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/RuntimeSettings
              examples:
                current:
                  value:
                    observed_at: 2026-08-15T10:00:00Z
                    source: config
                    log: { level: info, buffered_records: 4096 }
                    dns_log: { max_records: 2048 }
                    flows: { max_flows: 10000, retention_seconds: 300 }
                    geodata:
                      source: default
                      geosite:
                        urls:
                          - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat
                          - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
                      geoip:
                        urls:
                          - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat
                          - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
                      auto_update: { enabled: true, interval_hours: 24, cron: '0 3 * * *' }
                      download: { route: routing, group_id: null }
                      verify_checksum: true
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
                config_sources:
                  summary: Geodata URLs written from the configuration file
                  value:
                    observed_at: 2026-08-15T10:00:00Z
                    source: config
                    log: { level: info, buffered_records: 4096 }
                    dns_log: { max_records: 2048 }
                    flows: { max_flows: 10000, retention_seconds: 300 }
                    geodata:
                      source: config
                      geosite:
                        urls: [ https://mirror.example.net/geodata/geosite.dat ]
                      geoip:
                        urls: [ https://mirror.example.net/geodata/geoip.dat ]
                      auto_update: { enabled: true, interval_hours: 48, cron: null }
                      download: { route: group, group_id: group-proxy }
                      verify_checksum: true
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
                level_only:
                  summary: An engine whose only runtime setting is the log level
                  value:
                    observed_at: 2026-08-15T10:00:00Z
                    source: config
                    log: { level: info }
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
    patch:
      operationId: patchRuntimeSettings
      tags: [ "Runtime settings" ]
      summary: Change runtime-adjustable settings without a reload
      description: |
        Requires control and resources.runtime_settings.available. The body is a
        merge: an absent field keeps its value. Every value is checked before
        anything changes, and a rejected patch changes nothing. A field the schema
        does not define, or a value outside its schema range or advertised bounds,
        returns 400 invalid_request. A field not listed in
        resources.runtime_settings.fields, a log level not in
        resources.logs.levels, or pinning a recorder whose allowed is false returns
        422 unsupported_value; see Errors. Shrinking a ring drops its oldest records and expires
        cursors older than the new floor. The change applies immediately and lasts
        until the process restarts or the next configuration activation resets it; it
        is not written to the configuration file.

        geodata is the exception. It requires resources.geodata.configurable_sources,
        control and a credential; an anonymous loopback caller gets 403
        permission_denied. The engine keeps a geodata patch as an override for as
        long as resources.geodata.lifecycle advertises and does not change the
        top-level source. Patching geosite or geoip overrides only that URL list
        (geodata.source becomes override); auto_update, download and verify_checksum
        are each overridden on their own; null removes every override and every
        value taken from the configuration file, so the built-in sources and
        defaults apply until the engine next takes file values. When it takes file
        values, a URL list, download route, schedule or checksum switch the
        configuration file names replaces the override for that field. Geodata URLs are fetched under the
        outbound-request policy in api-config. More URLs than resources.geodata.max_urls, an interval outside
        resources.geodata.interval_hours, interval_hours together with cron, or a
        cron expression the engine refuses returns 400. A patch never downloads; POST
        /geodata/update does. A download with route group whose group_id is not a
        current group returns 409 state_conflict and changes nothing.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./openapi.yaml#/components/schemas/RuntimeSettingsPatch
            examples:
              debug:
                value:
                  log: { level: debug }
                  dns_log: { max_records: 1024 }
              level_only:
                summary: Change only the log level
                value:
                  log: { level: info }
              geodata_sources:
                summary: Use a mirror first
                value:
                  geodata:
                    geosite:
                      urls:
                        - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
                        - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat
                    geoip:
                      urls:
                        - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
                        - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat
              geodata_auto_update:
                summary: Update every two days
                value:
                  geodata:
                    auto_update: { enabled: true, interval_hours: 48 }
              geodata_auto_update_cron:
                summary: Update at 04:30 local time on weekdays
                value:
                  geodata:
                    auto_update: { cron: '30 4 * * 1-5' }
              geodata_download:
                summary: Download geodata through a group
                value:
                  geodata:
                    download: { route: group, group_id: group-proxy }
              geodata_skip_checksum:
                summary: Accept files from a mirror without a checksum file
                value:
                  geodata:
                    verify_checksum: false
              geodata_reset:
                summary: Return to the built-in sources
                value:
                  geodata: null
      responses:
        "200":
          description: Settings after the change
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/RuntimeSettings
              examples:
                changed:
                  value:
                    observed_at: 2026-08-15T10:00:05Z
                    source: runtime
                    log: { level: debug, buffered_records: 4096 }
                    dns_log: { max_records: 1024 }
                    flows: { max_flows: 10000, retention_seconds: 300 }
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
                geodata_stored:
                  value:
                    observed_at: 2026-08-15T10:00:05Z
                    source: config
                    log: { level: info, buffered_records: 4096 }
                    dns_log: { max_records: 2048 }
                    flows: { max_flows: 10000, retention_seconds: 300 }
                    geodata:
                      source: override
                      geosite:
                        urls:
                          - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
                          - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat
                      geoip:
                        urls:
                          - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
                          - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat
                      auto_update: { enabled: true, interval_hours: 24, cron: '0 3 * * *' }
                      download: { route: routing, group_id: null }
                      verify_checksum: true
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          description: A field the schema does not define, or a value outside its schema range or advertised bounds
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                above_ceiling:
                  value:
                    error:
                      code: invalid_request
                      message: dns_log.max_records exceeds the advertised ceiling.
                    request_id: request-3
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
        "415":
          $ref: ./openapi.yaml#/components/responses/UnsupportedMediaType
        "409":
          description: geodata.download names a group_id that is not a current group
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                unknown_group:
                  value:
                    error:
                      code: state_conflict
                      message: geodata.download.group_id is not a current group.
                      details: null
                    request_id: request-4
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "422":
          description: A field not in resources.runtime_settings.fields, a level not in resources.logs.levels, or pinning a recorder that is not allowed
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                unadvertised_level:
                  value:
                    error:
                      code: unsupported_value
                      message: log.level is not an advertised level.
                      details: null
                    request_id: request-4
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
          description: A setting could not be stored (temporarily_unavailable). Read the settings back before retrying after Retry-After.
schemas:
  RuntimeSettingField:
    type: string
    enum: [ log.level, log.buffered_records, dns_log.max_records, flows.max_flows, flows.retention_seconds, record_flows, record_logs, record_dns_log, geodata ]
  RecorderMode:
    type: string
    enum: [ "on", "off", auto ]
    description: A recorder's mode. "on" keeps a permitted recorder on without clients, "off" forces it off, and auto (the startup default) lets the engine record on demand. What counts as demand, and how long it lasts, is engine-defined. PATCH sets it, GET reports it in RecorderState.mode, and resources.flows.recording reports the effective flow policy, which can be off when recording is disallowed or sampled when the engine samples.
  RecorderState:
    type: object
    required: [ allowed, mode, active ]
    properties:
      allowed:
        type: boolean
        description: The configuration permits this recorder; false means never, whatever the mode.
      mode:
        $ref: ./openapi.yaml#/components/schemas/RecorderMode
        description: The mode last set by PATCH, or auto when none was set.
      active:
        type: boolean
        description: The recorder is capturing right now.
  RuntimeSettings:
    type: object
    required: [ observed_at, source ]
    description: Every section is optional. A value appears when resources.runtime_settings.fields lists it; an engine may also report a value it cannot change.
    properties:
      observed_at:
        $ref: ./openapi.yaml#/components/schemas/Timestamp
      source:
        type: string
        enum: [ config, runtime ]
        description: config while every value comes from the activated configuration; runtime once any PATCH overrode one. geodata has its own source and does not affect this one.
      log:
        type: object
        minProperties: 1
        properties:
          level:
            $ref: ./openapi.yaml#/components/schemas/LogLevel
            description: Minimum severity the engine emits. A lower stream level cannot recover records the engine did not emit.
          buffered_records:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 1
            description: Log replay ring capacity, within logs.min_buffered_records and logs.max_buffered_records. Independent of level.
      dns_log:
        type: object
        required: [ max_records ]
        properties:
          max_records:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 1
            description: DNS log ring capacity, within dns_log.min_records and dns_log.max_records.
      flows:
        type: object
        minProperties: 1
        properties:
          max_flows:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 1
            description: Retained flows, within flows.min_flows and flows.max_flows.
          retention_seconds:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 1
            description: Maximum age of a retained terminal flow, in seconds, bounded by resources.flows.retention_seconds. Capacity pressure may evict it earlier.
      recording:
        type: object
        minProperties: 1
        description: |
          Read-only recorder state. Each recorder appears when its record_* field is listed in
          resources.runtime_settings.fields. In auto mode a recorder captures on demand, so the
          first history a client reads may be empty. Engine-specific demand rules are
          documented with the engine; see the honk notes.
        properties:
          flows:
            $ref: ./openapi.yaml#/components/schemas/RecorderState
          logs:
            $ref: ./openapi.yaml#/components/schemas/RecorderState
          dns_log:
            $ref: ./openapi.yaml#/components/schemas/RecorderState
          events:
            type: object
            required: [ active ]
            properties:
              active:
                type: boolean
                description: Event capture is running.
          grace_remaining_seconds:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            description: Seconds left in the engine's attachment grace after the last client left, 0 while a client is attached or once the grace has run out. Which recorders follow this grace is engine-defined, and a recorder may keep its own demand timer that this value does not count. Absent when the engine keeps no attachment grace.
      geodata:
        $ref: ./openapi.yaml#/components/schemas/GeoDataSettings
        description: Geodata download sources and automatic updates. Present when resources.geodata.configurable_sources is true. URLs are returned as written, with only listener-secret values masked, to every admitted caller.
  RuntimeSettingsPatch:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      record_flows:
        $ref: ./openapi.yaml#/components/schemas/RecorderMode
      record_logs:
        $ref: ./openapi.yaml#/components/schemas/RecorderMode
      record_dns_log:
        $ref: ./openapi.yaml#/components/schemas/RecorderMode
      log:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          level:
            $ref: ./openapi.yaml#/components/schemas/LogLevel
          buffered_records:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 1
      dns_log:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          max_records:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 1
      flows:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          max_flows:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 1
          retention_seconds:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 1
      geodata:
        $ref: ./openapi.yaml#/components/schemas/GeoDataSettingsPatch
