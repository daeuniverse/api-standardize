paths:
  /api/v1/dns/query:
    get:
      operationId: queryDns
      summary: Execute a routed diagnostic DNS query
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: domain
          in: query
          required: true
          description: DNS name within the 255-wire-octet and 63-octet-label limits.
          schema:
            type: string
            minLength: 1
          example: example.com
        - name: type
          in: query
          description: Unique record types; repeated query parameter.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              $ref: ./openapi.yaml#/components/schemas/DnsRecordType
            default: [ A ]
          example: [ A, AAAA ]
        - name: upstream
          in: query
          schema:
            type: string
            minLength: 1
        - name: cache_mode
          in: query
          schema:
            type: string
            enum: [ normal, bypass ]
            default: normal
        - $ref: ./openapi.yaml#/components/parameters/Detail
      responses:
        "200":
          description: Per-record-type DNS results, including DNS failures
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/DnsQueryResponse
              examples:
                dual_stack:
                  value:
                    domain: example.com
                    cache_mode: normal
                    query_time: 2026-08-14T00:00:00Z
                    results:
                      - type: A
                        cached: false
                        cache_entry_id: dns-entry-01HZX4K8W5
                        upstream: alidns
                        route:
                          source: dns.routing
                          rule: domain(example.com)
                        status: NOERROR
                        elapsed_ms: 12
                        question:
                          name: example.com.
                          type: A
                        answers:
                          - name: example.com.
                            type: A
                            class: IN
                            ttl: 600
                            data: 93.184.216.34
                      - type: AAAA
                        cached: false
                        cache_entry_id: null
                        upstream: alidns
                        route:
                          source: dns.routing
                          rule: domain(example.com)
                        status: NODATA
                        elapsed_ms: 11
                        question:
                          name: example.com.
                          type: AAAA
                        answers: []
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "413":
          $ref: ./openapi.yaml#/components/responses/TooLarge
        "422":
          $ref: ./openapi.yaml#/components/responses/Unprocessable
        "429":
          $ref: ./openapi.yaml#/components/responses/RateLimited
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
  /api/v1/dns/cache:
    get:
      operationId: listDnsCache
      summary: Read a paginated DNS cache snapshot
      description: |
        A page holds at most limit entries and may hold fewer while
        next_cursor is non-null, for example when the server's response size
        limit ends it early. Only a null next_cursor ends the walk. An entry
        whose answers alone exceed that limit is served whole on a page of
        its own, never clipped or refused.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: name
          in: query
          schema:
            type: string
            minLength: 1
        - name: domain
          in: query
          schema:
            type: string
            minLength: 1
        - name: type
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: ./openapi.yaml#/components/schemas/DnsRecordType
        - name: include_expired
          in: query
          schema:
            type: boolean
            default: false
        - $ref: ./openapi.yaml#/components/parameters/Limit1000
        - $ref: ./openapi.yaml#/components/parameters/Cursor
        - $ref: ./openapi.yaml#/components/parameters/Detail
      responses:
        "200":
          description: DNS cache page
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/DnsCacheList
              examples:
                entries:
                  value:
                    observed_at: 2026-08-15T12:00:00Z
                    coverage:
                      positive: true
                      negative: true
                      persistent: false
                    entries:
                      - entry_id: dns-entry-01HZX4K8W5
                        domain: example.com.
                        type: A
                        class: IN
                        status: NOERROR
                        answers:
                          - name: example.com.
                            type: A
                            class: IN
                            data: 93.184.216.34
                            ttl: 3600
                        expires_at: 2026-08-15T13:00:00Z
                        stale_until: null
                      - entry_id: dns-entry-01HZX4K8W6
                        domain: missing.example.com.
                        type: A
                        class: IN
                        status: NXDOMAIN
                        answers: []
                        expires_at: 2026-08-15T12:05:00Z
                        stale_until: 2026-08-15T12:06:00Z
                    total: 1024
                    next_cursor: eyJvZmZzZXQiOjEwMH0
                    usage:
                      entries: "1024"
                      entry_capacity: "100000"
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
    delete:
      operationId: deleteDnsCacheByName
      summary: Delete cache entries for one exact name
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: name
          in: query
          required: true
          description: Exact canonicalizable DNS name; required to prevent an accidental flush.
          schema:
            type: string
            minLength: 1
          example: example.com.
        - name: type
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: ./openapi.yaml#/components/schemas/DnsRecordType
          example: [ A, AAAA ]
      responses:
        "200":
          description: Idempotent matching deletion result
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/DeleteMatchingCount
              examples:
                deleted:
                  value:
                    matched: 2
                    deleted: 2
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
  /api/v1/dns/cache/{entry_id}:
    delete:
      operationId: deleteDnsCacheEntry
      summary: Delete one opaque DNS cache entry
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/DnsEntryId
      responses:
        "200":
          description: Idempotent deletion result
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/DeleteCount
              examples:
                deleted:
                  value:
                    deleted: 1
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
  /api/v1/dns/cache/flush:
    post:
      operationId: flushDnsCache
      summary: Flush the complete runtime DNS cache
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ./openapi.yaml#/components/schemas/EmptyObject
      responses:
        "200":
          description: Cache invalidation barrier result
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/DeleteMatchingCount
              examples:
                flushed:
                  value:
                    matched: 1024
                    deleted: 1024
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "415":
          $ref: ./openapi.yaml#/components/responses/UnsupportedMediaType
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
  /api/v1/dns/log:
    get:
      operationId: listDnsLog
      summary: Read the bounded ring of recent resolutions
      description: |
        Requires resources.dns_log.available. Records client DNS resolutions,
        excluding diagnostic /dns/query calls, in a bounded in-memory ring.
        Results are newest first. The ring holds at most
        resources.dns_log.max_records and is cleared on restart.
        A limit above resources.dns_log.max_page_size returns 400 invalid_request.
        A page may hold fewer than limit records while next_cursor is
        non-null, for example when the server's response size limit ends it
        early. Only a null next_cursor ends the walk. A record whose answers
        alone exceed that limit is served whole on a page of its own, never
        clipped or refused.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: name
          in: query
          description: Case-insensitive substring of the question name.
          schema:
            type: string
            minLength: 1
          example: telegram
        - name: type
          in: query
          schema:
            $ref: ./openapi.yaml#/components/schemas/DnsRecordType
          example: A
        - name: src
          in: query
          description: Client source IP literal, IPv4 or IPv6.
          schema:
            type: string
            minLength: 1
          example: 10.0.0.12
        - name: limit
          in: query
          schema:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 1
          example: 200
        - name: cursor
          in: query
          description: Opaque cursor from a previous page; older records follow it.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Recent resolutions, newest first
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/DnsLogList
              examples:
                recent:
                  value:
                    observed_at: 2026-08-15T10:00:00Z
                    total: 2
                    next_cursor: null
                    records:
                      - id: dl-000002
                        observed_at: 2026-08-15T09:59:59Z
                        src: 10.0.0.12:53211
                        question: { name: api.telegram.org., type: A }
                        status: NOERROR
                        cached: false
                        upstream: tls://1.1.1.1
                        route: { source: dns.routing, rule: "qname(geosite: telegram) -> proxy" }
                        elapsed_ms: 38
                        answers:
                          - { name: api.telegram.org., type: A, class: IN, ttl: 240, data: 149.154.167.220 }
                      - id: dl-000001
                        observed_at: 2026-08-15T09:59:58Z
                        src: "[2001:db8::12]:53210"
                        question: { name: cdn.bilibili.com., type: AAAA }
                        status: NOERROR
                        cached: true
                        upstream: null
                        route: { source: default, rule: null }
                        elapsed_ms: 0
                        answers: []
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
  /api/v1/dns/rules:
    get:
      operationId: listDnsRules
      summary: Read the running generation's DNS routing rules
      description: |
        Requires resources.dns_rules.available. Return the DNS routing rules of the
        running generation, which is the accepted configuration, as two ordered lists:
        request rules pick how a query is resolved, and response rules decide whether
        an answer is accepted, rejected or re-queried. Each list is in evaluation order
        and ends with exactly one fallback entry. A fallback the configuration does not
        write still appears, with the backend's default action and a null source.
        A rule the configuration parser omitted with a diagnostic is not listed.
        This resource is read-only. Rules are edited by replacing the source that holds
        them with PUT /api/v1/config/sources/{source_id}, the same as traffic rules;
        there is no rule-level write endpoint. rule_id is stable within a generation
        and addresses the rule; it is unique across both lists. expression is the
        source text as written; upstream is the name as the engine resolved it and may
        differ in case from the source text. generation_id identifies the rules'
        routing generation; refetch after generation.changed. There is no paginated snapshot. If a coherent
        generation cannot be pinned, return 503 snapshot_unavailable. If either list
        exceeds resources.dns_rules.max_rules, return 503 temporarily_unavailable
        rather than silently truncate it.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Ordered request and response rules, each with its fallback, from one running generation
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/DnsRuleList
              examples:
                running:
                  value:
                    generation_id: generation-42
                    request:
                      - rule_id: dns_request:0
                        index: 0
                        expression: qname(geosite:cn) -> alidns
                        action: upstream
                        upstream: alidns
                        source:
                          file: "[redacted]/config.dae"
                          source_id: source-main
                          line: 40
                          column: 7
                        kind: rule
                      - rule_id: dns_request:1
                        index: 1
                        expression: qtype(aaaa) -> reject
                        action: reject
                        upstream: null
                        source:
                          file: "[redacted]/config.dae"
                          source_id: source-main
                          line: 41
                          column: 7
                        kind: rule
                      - rule_id: dns_request:2
                        index: 2
                        expression: "fallback: googledns"
                        action: upstream
                        upstream: googledns
                        source:
                          file: "[redacted]/config.dae"
                          source_id: source-main
                          line: 42
                          column: 7
                        kind: fallback
                    response:
                      - rule_id: dns_response:0
                        index: 0
                        expression: upstream(googledns) && ip(geoip:private) -> alidns
                        action: requery
                        upstream: alidns
                        source:
                          file: "[redacted]/config.dae"
                          source_id: source-main
                          line: 45
                          column: 7
                        kind: rule
                      - rule_id: dns_response:1
                        index: 1
                        expression: "fallback: accept"
                        action: accept
                        upstream: null
                        source: null
                        kind: fallback
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "503":
          description: A list exceeds max_rules (temporarily_unavailable), or a coherent generation could not be pinned (snapshot_unavailable)
          headers:
            Retry-After:
              description: Retry delay in seconds.
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                temporarily_unavailable:
                  value:
                    error:
                      code: temporarily_unavailable
                      message: A DNS rule list exceeds resources.dns_rules.max_rules.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
                snapshot_unavailable:
                  value:
                    error:
                      code: snapshot_unavailable
                      message: A coherent routing generation is unavailable; retry the read.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
schemas:
  DnsQueryLimits:
    type: object
    required: [ max_types_per_request, query_timeout_ms, max_response_bytes, per_principal_requests_per_minute, global_requests_per_minute ]
    properties:
      max_types_per_request:
        type: integer
        minimum: 1
      query_timeout_ms:
        type: integer
        minimum: 1
      max_response_bytes:
        type: integer
        minimum: 1
      per_principal_requests_per_minute:
        type: integer
        minimum: 1
      global_requests_per_minute:
        type: integer
        minimum: 1
  DnsRecordType:
    type: string
    pattern: ^(?:[A-Z][A-Z0-9-]*|TYPE[0-9]{1,5}|[0-9]{1,5})$
  DnsAnswer:
    type: object
    required: [ name, type, class, ttl, data ]
    properties:
      name:
        type: string
        minLength: 1
      type:
        $ref: ./openapi.yaml#/components/schemas/DnsRecordType
      class:
        type: string
        minLength: 1
      ttl:
        type: integer
        minimum: 0
        maximum: 4294967295
      data:
        type: string
  DnsQuestion:
    type: object
    required: [ name, type ]
    properties:
      name:
        type: string
        minLength: 1
      type:
        $ref: ./openapi.yaml#/components/schemas/DnsRecordType
  DnsRoute:
    type: object
    required: [ source, rule ]
    properties:
      source:
        type: string
        enum: [ forced, dns.routing, default ]
      rule:
        type: [ string, "null" ]
  DnsQueryResult:
    type: object
    required: [ type, cached, cache_entry_id, upstream, route, status, elapsed_ms, question ]
    properties:
      type:
        $ref: ./openapi.yaml#/components/schemas/DnsRecordType
      cached:
        type: boolean
      cache_entry_id:
        type: [ string, "null" ]
      upstream:
        type: [ string, "null" ]
      route:
        $ref: ./openapi.yaml#/components/schemas/DnsRoute
      status:
        type: string
        minLength: 1
      elapsed_ms:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      question:
        $ref: ./openapi.yaml#/components/schemas/DnsQuestion
      answers:
        type: array
        items:
          $ref: ./openapi.yaml#/components/schemas/DnsAnswer
  DnsQueryResponse:
    type: object
    required: [ domain, cache_mode, query_time, results ]
    properties:
      domain:
        type: string
        minLength: 1
      cache_mode:
        type: string
        enum: [ normal, bypass ]
      query_time:
        $ref: ./openapi.yaml#/components/schemas/Timestamp
      results:
        type: array
        minItems: 1
        items:
          $ref: ./openapi.yaml#/components/schemas/DnsQueryResult
  DnsCacheCoverage:
    type: object
    required: [ positive, negative, persistent ]
    properties:
      positive:
        type: boolean
      negative:
        type: boolean
      persistent:
        type: boolean
  DnsCacheEntry:
    type: object
    required: [ entry_id, domain, type, class, status, expires_at, stale_until ]
    properties:
      entry_id:
        type: string
        minLength: 1
      domain:
        type: string
        minLength: 1
        pattern: \.$
      type:
        $ref: ./openapi.yaml#/components/schemas/DnsRecordType
      class:
        type: string
        minLength: 1
      status:
        type: string
        minLength: 1
      answers:
        type: array
        items:
          $ref: ./openapi.yaml#/components/schemas/DnsAnswer
      expires_at:
        $ref: ./openapi.yaml#/components/schemas/Timestamp
      stale_until:
        $ref: ./openapi.yaml#/components/schemas/NullableTimestamp
  DnsCacheList:
    type: object
    required: [ observed_at, coverage, entries, total, next_cursor ]
    properties:
      observed_at:
        $ref: ./openapi.yaml#/components/schemas/Timestamp
      coverage:
        $ref: ./openapi.yaml#/components/schemas/DnsCacheCoverage
      entries:
        type: array
        items:
          $ref: ./openapi.yaml#/components/schemas/DnsCacheEntry
      total:
        $ref: ./openapi.yaml#/components/schemas/SafeUInt
      next_cursor:
        type: [ string, "null" ]
      usage:
        $ref: ./openapi.yaml#/components/schemas/DnsCacheUsage
        description: Absent from servers that predate cache usage reporting.
  DnsCacheUsage:
    type: object
    description: >-
      Whole runtime cache at snapshot time, independent of the listing filters.
      Every page of one snapshot repeats the same values. The entry count is the
      cache's only limit; the size of an entry is not bounded.
    required: [ entries, entry_capacity ]
    properties:
      entries:
        $ref: ./openapi.yaml#/components/schemas/UInt64
      entry_capacity:
        $ref: ./openapi.yaml#/components/schemas/UInt64
        description: Effective entry limit after the engine applies its bounds, at most 100,000.
  DnsLogRecord:
    type: object
    required: [ id, observed_at, src, question, status, cached, upstream, route, elapsed_ms, answers ]
    properties:
      id:
        type: string
        minLength: 1
        description: Opaque, unique within the running instance; the cursor is derived from it.
      observed_at:
        $ref: ./openapi.yaml#/components/schemas/Timestamp
      src:
        type: [ string, "null" ]
        description: Client socket address, IPv6 in brackets; null when the resolver itself asked.
      question:
        $ref: ./openapi.yaml#/components/schemas/DnsQuestion
      status:
        type: string
        minLength: 1
        description: RCODE name such as NOERROR or NXDOMAIN, or an engine outcome such as TIMEOUT.
      cached:
        type: boolean
      upstream:
        type: [ string, "null" ]
        description: The upstream that answered, null on a cache hit or failure before sending.
      route:
        $ref: ./openapi.yaml#/components/schemas/DnsRoute
      elapsed_ms:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      answers:
        type: array
        items:
          $ref: ./openapi.yaml#/components/schemas/DnsAnswer
  DnsLogList:
    type: object
    required: [ observed_at, total, next_cursor, records ]
    properties:
      observed_at:
        $ref: ./openapi.yaml#/components/schemas/Timestamp
      total:
        $ref: ./openapi.yaml#/components/schemas/SafeUInt
        description: Records in the ring at observed_at, before filters.
      next_cursor:
        type: [ string, "null" ]
      records:
        type: array
        items:
          $ref: ./openapi.yaml#/components/schemas/DnsLogRecord
  DnsRoutingRule:
    type: object
    required: [ rule_id, index, expression, action, upstream, source, kind ]
    properties:
      rule_id:
        type: string
        minLength: 1
        description: Stable within the generation and unique across both lists; addresses the rule. Opaque to clients.
      index:
        $ref: ./openapi.yaml#/components/schemas/SafeUInt
        description: Zero-based evaluation order within its list and generation, not a cross-generation identity.
      expression:
        type: string
        minLength: 1
        description: The rule's source text as written, for display; not an editable source representation.
      action:
        type: string
        enum: [ upstream, asis, reject, accept, requery ]
        description: |
          Request rules: upstream sends the query to the named upstream, asis sends it
          to the original destination, reject answers it empty. Response rules: accept
          keeps the answer, reject replaces it with an empty one, requery resolves the
          query again through the named upstream.
      upstream:
        type: [ string, "null" ]
        minLength: 1
        description: Upstream name for upstream and requery, as the engine resolved it; it may differ in case from the source text. Null for other actions.
      source:
        $ref: ./openapi.yaml#/components/schemas/RuleSource
      kind:
        type: string
        enum: [ rule, fallback ]
    if:
      required: [ action ]
      properties:
        action:
          enum: [ upstream, requery ]
    then:
      properties:
        upstream:
          type: string
    else:
      properties:
        upstream:
          type: "null"
  DnsRuleList:
    type: object
    required: [ generation_id, request, response ]
    properties:
      generation_id:
        type: string
        minLength: 1
      request:
        type: array
        minItems: 1
        items:
          allOf:
            - $ref: ./openapi.yaml#/components/schemas/DnsRoutingRule
            - properties:
                action:
                  enum: [ upstream, asis, reject ]
        contains:
          type: object
          required: [ kind ]
          properties:
            kind:
              const: fallback
        minContains: 1
        maxContains: 1
        description: Request rules in evaluation order with unique rule_id and index values, ending with exactly one fallback entry.
      response:
        type: array
        minItems: 1
        items:
          allOf:
            - $ref: ./openapi.yaml#/components/schemas/DnsRoutingRule
            - properties:
                action:
                  enum: [ accept, reject, requery ]
        contains:
          type: object
          required: [ kind ]
          properties:
            kind:
              const: fallback
        minContains: 1
        maxContains: 1
        description: Response rules in evaluation order with unique rule_id and index values, ending with exactly one fallback entry.
  DeleteCount:
    type: object
    required: [ deleted ]
    properties:
      deleted:
        type: integer
        minimum: 0
  DeleteMatchingCount:
    type: object
    required: [ matched, deleted ]
    properties:
      matched:
        type: integer
        minimum: 0
      deleted:
        type: integer
        minimum: 0
